
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b12">
<title>EMORA AI</title>
<style>
:root {
  --bg:#0b0b12;
  --panel:#12121d;
  --card:#191927;
  --border:#303047;
  --text:#f7f5ff;
  --muted:#9695ad;
  --purple:#8b5cf6;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh;
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
button,input { font:inherit; }
button { -webkit-tap-highlight-color:transparent; }
.app { min-height:100dvh; display:flex; flex-direction:column; }
header {
  height:65px; display:flex; align-items:center;
  justify-content:space-between; padding:0 16px;
  border-bottom:1px solid #252536;
  background:#10101a;
}
.brand { display:flex; align-items:center; gap:11px; }
.logo {
  width:39px;height:39px;border-radius:13px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#a78bfa,#6d28d9);
  font-weight:900;font-size:20px;color:white;
  box-shadow:0 0 25px #8b5cf633;
}
.brand-name { font-size:17px;font-weight:800;letter-spacing:1px; }
.brand-sub { color:var(--muted);font-size:11px;margin-top:2px; }
.icon-btn {
  width:40px;height:40px;min-width:40px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:13px;
  color:#e8e4ff;background:#202031;cursor:pointer;
  transition:.2s;
}
.icon-btn:active { transform:scale(.93); }
.icon-btn svg {
  width:20px;height:20px;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}
main {
  flex:1;width:100%;max-width:850px;margin:0 auto;
  padding:24px 16px 12px;display:flex;flex-direction:column;
}
.welcome { margin:auto 0 25px;text-align:center;padding:20px 0; }
.orb {
  width:76px;height:76px;border-radius:25px;margin:0 auto 20px;
  display:grid;place-items:center;font-size:34px;
  background:radial-gradient(circle at 30% 20%,#c4b5fd,#7c3aed 55%,#32105e);
  box-shadow:0 0 55px #8b5cf633;
}
.welcome h1 { margin:0 0 10px;font-size:clamp(25px,6vw,34px); }
.welcome h1 span {
  background:linear-gradient(90deg,#c4b5fd,#8b5cf6);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.welcome p { color:var(--muted);font-size:14px;line-height:1.7;margin:0; }
.chat { display:flex;flex-direction:column;gap:15px;padding-bottom:16px; }
.message {
  max-width:88%;padding:13px 15px;border-radius:17px;
  font-size:14px;line-height:1.7;white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.message.user {
  align-self:flex-end;background:#5530a0;border-bottom-right-radius:5px;
}
.message.ai {
  align-self:flex-start;background:#191927;
  border:1px solid #2b2b40;border-bottom-left-radius:5px;
}
.message .sender {
  font-size:11px;color:#c4b5fd;margin-bottom:5px;font-weight:700;
}
.composer-wrap { position:sticky;bottom:0;padding:10px 12px 14px;background:linear-gradient(180deg,#0b0b1200,#0b0b12 22%); }
.composer {
  width:100%;max-width:850px;margin:0 auto;
  display:flex;align-items:center;gap:6px;
  padding:8px;border:1px solid #37374f;border-radius:21px;
  background:#151520;box-shadow:0 8px 35px #0006;
}
.composer .icon-btn { width:37px;height:39px;min-width:37px;border-radius:12px; }
.message-input {
  flex:1;min-width:0;width:100%;height:42px;
  color:white;background:transparent;border:0;outline:none;
  padding:0 3px;font-size:14px;
}
.message-input::placeholder { color:#9291a9; }
.call-btn { color:#d8c5ff;background:#30204a;border-color:#64458c; }
.call-btn.active { background:#a32b45;color:white;border-color:#e85b77; }
.image-btn { color:#b8a0ff; }
.send-btn { color:white;background:linear-gradient(135deg,#9b72ff,#6834df);border:0; }
.status {
  max-width:850px;width:100%;margin:0 auto;
  padding:0 15px 7px;text-align:center;color:var(--muted);font-size:11px;
}
.preview {
  max-width:850px;width:100%;margin:0 auto 7px;
  display:none;align-items:center;gap:8px;
  color:#c4b5fd;font-size:12px;overflow:hidden;
}
.preview img { max-width:45px;max-height:45px;border-radius:9px; }
.preview span { overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.hidden { display:none!important; }
@media(max-width:390px) {
  header { padding:0 11px; }
  main { padding-left:11px;padding-right:11px; }
  .composer-wrap { padding-left:7px;padding-right:7px; }
  .composer { gap:4px;padding:6px;border-radius:18px; }
  .composer .icon-btn { width:32px;height:36px;min-width:32px;border-radius:10px; }
  .composer .icon-btn svg { width:18px;height:18px; }
  .message-input { font-size:12px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">E</div>
      <div>
        <div class="brand-name">EMORA AI</div>
        <div class="brand-sub" id="serverStatus">PERSONAL AI ASSISTANT</div>
      </div>
    </div>
    <button class="icon-btn" id="clearBtn" title="নতুন চ্যাট" aria-label="নতুন চ্যাট">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <main>
    <section class="welcome" id="welcome">
      <div class="orb">✦</div>
      <h1>হ্যালো, <span>বন্ধু!</span></h1>
      <p>আমি EMORA AI। তোমার কী সাহায্য দরকার?<br>মেসেজ লেখো অথবা ভয়েসে কথা বলো।</p>
    </section>
    <section class="chat" id="chat" aria-live="polite"></section>
  </main>

  <div class="preview" id="preview">
    <img id="previewImage" alt="ছবির প্রিভিউ">
    <span id="previewName"></span>
    <button class="icon-btn" id="removeFileBtn" title="ফাইল সরাও" aria-label="ফাইল সরাও">×</button>
  </div>

  <div class="status" id="status" role="status"></div>

  <div class="composer-wrap">
    <form class="composer" id="composer">
      <button class="icon-btn" type="button" id="attachBtn"
        title="ফাইল যুক্ত করো" aria-label="ফাইল যুক্ত করো">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>

      <input class="message-input" id="messageInput"
        type="text" placeholder="মেসেজ লিখো..."
        autocomplete="off" aria-label="মেসেজ লিখো">

      <button class="icon-btn" type="button" id="recordBtn"
        title="ভয়েস রেকর্ডিং" aria-label="ভয়েস রেকর্ডিং">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>
      </button>

      <button class="icon-btn image-btn" type="button" id="imageBtn"
        title="ছবি আপলোড" aria-label="ছবি আপলোড">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      </button>

      <button class="icon-btn call-btn" type="button" id="callBtn"
        title="AI ভয়েস কল" aria-label="AI ভয়েস কল">
        <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg>
      </button>

      <button class="icon-btn send-btn" type="submit"
        title="মেসেজ পাঠাও" aria-label="মেসেজ পাঠাও">
        <svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </button>
    </form>
  </div>
</div>

<input type="file" id="fileInput" hidden>
<input type="file" id="imageInput" accept="image/*" hidden>

<script>
const $ = id => document.getElementById(id);
const chat = $("chat");
const input = $("messageInput");
const welcome = $("welcome");
const statusBox = $("status");
const fileInput = $("fileInput");
const imageInput = $("imageInput");

let selectedFile = null;
let busy = false;
let recognition = null;
let recording = false;
let callActive = false;
let callRecognition = null;
let callUtterance = null;
let callAudio = null;

const API_BASE = location.protocol === "file:"
  ? "https://my-ai-server-hncp.onrender.com"
  : location.origin;

function setStatus(text) {
  statusBox.textContent = text || "";
}

function addMessage(text, who) {
  welcome.classList.add("hidden");
  const el = document.createElement("div");
  el.className = "message " + who;
  const sender = document.createElement("div");
  sender.className = "sender";
  sender.textContent = who === "user" ? "তুমি" : "EMORA AI";
  const body = document.createElement("div");
  body.textContent = text;
  el.append(sender, body);
  chat.appendChild(el);
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  return body;
}

async function readResponse(response) {
  const text = await response.text();
  let data;
  try { data = JSON.parse(text); }
  catch { throw new Error("সার্ভার থেকে সঠিক উত্তর আসেনি।"); }
  if (!response.ok) {
    throw new Error(data.error || data.message || "সার্ভারে সমস্যা হয়েছে।");
  }
  return data;
}

async function sendMessage(text) {
  text = (text || "").trim();
  if ((!text && !selectedFile) || busy) return;

  const file = selectedFile;
  const isImage = file && file.type.startsWith("image/");
  const shownText = text || (isImage ? "এই ছবিটি বিশ্লেষণ করো।" : "ফাইলটি দেখো।");

  addMessage(shownText + (file ? "\n📎 " + file.name : ""), "user");
  input.value = "";
  selectedFile = null;
  updatePreview();
  busy = true;
  $("serverStatus").textContent = "CONNECTING...";
  setStatus("EMORA AI উত্তর তৈরি করছে...");

  try {
    let response, data;

    if (file && isImage) {
      const form = new FormData();
      form.append("image", file);
      form.append("message", text || "এই ছবিটি বিশ্লেষণ করো।");
      response = await fetch(API_BASE + "/analyze-image", {
        method: "POST", body: form
      });
    } else if (file) {
      throw new Error("এই ডেমোতে ছবি আপলোড সমর্থিত। অন্য ফাইলের জন্য সার্ভারে ফাইল API লাগবে।");
    } else {
      response = await fetch(API_BASE + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
    }

    data = await readResponse(response);
    const reply = data.reply || data.response || data.message ||
      data.text || data.answer;

    if (typeof reply !== "string" || !reply.trim()) {
      throw new Error("সার্ভার খালি উত্তর দিয়েছে।");
    }

    addMessage(reply, "ai");
    speakReply(reply);
    $("serverStatus").textContent = "PERSONAL AI ASSISTANT";
  } catch (err) {
    addMessage("দুঃখিত, উত্তর পাওয়া যায়নি। " + err.message +
      "\n\nসার্ভার চালু আছে কি না এবং API endpoint সঠিক কি না পরীক্ষা করো।", "ai");
    $("serverStatus").textContent = "CONNECTION ISSUE";
  } finally {
    busy = false;
    setStatus("");
    input.focus();
  }
}

$("composer").addEventListener("submit", e => {
  e.preventDefault();
  sendMessage(input.value);
});

$("clearBtn").onclick = () => {
  stopCall();
  chat.replaceChildren();
  welcome.classList.remove("hidden");
  input.value = "";
  selectedFile = null;
  updatePreview();
  setStatus("");
};

$("attachBtn").onclick = () => fileInput.click();
$("imageBtn").onclick = () => imageInput.click();

fileInput.onchange = () => {
  if (fileInput.files && fileInput.files[0]) {
    selectedFile = fileInput.files[0];
    updatePreview();
  }
};

imageInput.onchange = () => {
  if (imageInput.files && imageInput.files[0]) {
    selectedFile = imageInput.files[0];
    updatePreview();
  }
};

$("removeFileBtn").onclick = () => {
  selectedFile = null;
  fileInput.value = "";
  imageInput.value = "";
  updatePreview();
};

function updatePreview() {
  const preview = $("preview");
  const img = $("previewImage");
  if (!selectedFile) {
    preview.style.display = "none";
    img.removeAttribute("src");
    return;
  }
  preview.style.display = "flex";
  $("previewName").textContent = selectedFile.name;
  if (selectedFile.type.startsWith("image/")) {
    img.style.display = "block";
    img.src = URL.createObjectURL(selectedFile);
  } else {
    img.style.display = "none";
  }
}

function getSpeechRecognition() {
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

// Mic button: speech-to-text
$("recordBtn").onclick = () => {
  const SR = getSpeechRecognition();
  if (!SR) {
    setStatus("এই ব্রাউজারে ভয়েস রেকর্ডিং সমর্থিত নয়। Chrome-এ চেষ্টা করো।");
    return;
  }

  if (recording && recognition) {
    recognition.stop();
    return;
  }

  recognition = new SR();
  recognition.lang = "bn-BD";
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onstart = () => {
    recording = true;
    $("recordBtn").classList.add("call-btn", "active");
    setStatus("শুনছি... এখন কথা বলো।");
  };

  recognition.onresult = e => {
    let words = "";
    for (let i = 0; i < e.results.length; i++) {
      words += e.results[i][0].transcript;
    }
    input.value = words;
  };

  recognition.onerror = () => setStatus("মাইক্রোফোন অনুমতি পরীক্ষা করো।");
  recognition.onend = () => {
    recording = false;
    $("recordBtn").classList.remove("active");
    setStatus("");
    input.focus();
  };

  try { recognition.start(); }
  catch { setStatus("মাইক্রোফোন আবার চালু করার আগে একটু অপেক্ষা করো।"); }
};

// Free browser TTS fallback
function speakReply(text) {
  if (!("speechSynthesis" in window) || callActive) return;
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "bn-BD";
  utterance.rate = 1;
  speechSynthesis.speak(utterance);
}

// Voice call UI and browser speech loop.
// Full duplex AI voice requires a compatible real-time audio API.
$("callBtn").onclick = () => {
  if (callActive) {
    stopCall();
    return;
  }

  const SR = getSpeechRecognition();
  if (!SR || !("speechSynthesis" in window)) {
    setStatus("এই ব্রাউজারে লাইভ ভয়েস ফিচার সমর্থিত নয়।");
    return;
  }

  callActive = true;
  $("callBtn").classList.add("active");
  $("callBtn").title = "কল বন্ধ করো";
  setStatus("ভয়েস সেশন চালু হচ্ছে...");

  function listenInCall() {
    if (!callActive) return;
    callRecognition = new SR();
    callRecognition.lang = "bn-BD";
    callRecognition.interimResults = false;
    callRecognition.continuous = false;

    callRecognition.onresult = async e => {
      const spoken = e.results[0][0].transcript;
      setStatus("তোমার কথা বুঝছি...");
      await sendCallMessage(spoken);
    };

    callRecognition.onerror = () => {
      if (callActive) setStatus("কথা শোনা যায়নি। আবার বলো অথবা কল বন্ধ করো।");
    };

    callRecognition.onend = () => {
      if (callActive && !busy && !speechSynthesis.speaking) {
        setTimeout(listenInCall, 350);
      }
    };

    try { callRecognition.start(); }
    catch { setStatus("মাইক্রোফোন চালু করা যায়নি।"); }
  }

  async function sendCallMessage(spoken) {
    if (!callActive || busy) return;
    addMessage(spoken, "user");
    busy = true;
    try {
      const response = await fetch(API_BASE + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: spoken })
      });
      const data = await readResponse(response);
      const reply = data.reply || data.response || data.message ||
        data.text || data.answer;
      if (!reply) throw new Error("উত্তর পাওয়া যায়নি।");

      addMessage(reply, "ai");
      speechSynthesis.cancel();
      callUtterance = new SpeechSynthesisUtterance(reply);
      callUtterance.lang = "bn-BD";
      callUtterance.onend = () => {
        if (callActive) setTimeout(listenInCall, 250);
      };
      callUtterance.onerror = () => {
        if (callActive) setTimeout(listenInCall, 400);
      };
      speechSynthesis.speak(callUtterance);
      setStatus("EMORA AI কথা বলছে...");
    } catch (err) {
      addMessage("ভয়েস কলের উত্তর পাওয়া যায়নি: " + err.message, "ai");
      if (callActive) setTimeout(listenInCall, 600);
    } finally {
      busy = false;
    }
  }

  listenInCall();
};

function stopCall() {
  callActive = false;
  if (callRecognition) {
    try { callRecognition.onend = null; callRecognition.stop(); } catch {}
    callRecognition = null;
  }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  $("callBtn").classList.remove("active");
  $("callBtn").title = "AI ভয়েস কল";
  setStatus("");
}

window.addEventListener("pagehide", stopCall);
</script>
</body>
</html>
