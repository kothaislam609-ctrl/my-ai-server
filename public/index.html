<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EMORA AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial,sans-serif;
  background:#09090b;
  color:#fff;
}

button,
textarea,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= AUTH ================= */

.auth-screen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#24243a 0%,#09090b 55%);
  overflow:auto;
}

.auth-box{
  width:100%;
  max-width:390px;
  background:rgba(25,25,30,.96);
  border:1px solid #303038;
  border-radius:24px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:800;
  margin-bottom:8px;
}

.logo-sub{
  text-align:center;
  color:#999;
  margin-bottom:25px;
}

.auth-box input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:12px;
  border:1px solid #3b3b44;
  background:#111116;
  color:white;
  outline:none;
}

.auth-box input:focus{
  border-color:#7777ff;
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  background:#fff;
  color:#080808;
  font-weight:700;
}

.switch-auth{
  margin-top:18px;
  text-align:center;
  color:#aaa;
}

.switch-auth button{
  background:none;
  border:0;
  color:#fff;
  font-weight:700;
}

/* ================= APP ================= */

.app{
  width:100%;
  height:100dvh;
  display:flex;
  overflow:hidden;
}

/* ================= SIDEBAR ================= */

.sidebar{
  width:270px;
  height:100%;
  background:#101014;
  border-right:1px solid #292930;
  display:flex;
  flex-direction:column;
  padding:15px;
  flex-shrink:0;
  z-index:30;
}

.sidebar-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.sidebar-logo{
  font-size:21px;
  font-weight:800;
}

.new-chat{
  width:100%;
  padding:12px;
  border:1px solid #36363e;
  border-radius:12px;
  background:#19191f;
  color:white;
  margin-bottom:15px;
}

.new-chat:hover{
  background:#222229;
}

.recent-title{
  color:#777;
  font-size:12px;
  margin:5px 4px 8px;
}

.chat-list{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}

.chat-item{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:5px;
}

.chat-open{
  flex:1;
  min-width:0;
  border:0;
  background:transparent;
  color:#ccc;
  text-align:left;
  padding:11px;
  border-radius:10px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.chat-open:hover{
  background:#1c1c22;
  color:#fff;
}

.chat-delete{
  border:0;
  background:transparent;
  color:#777;
  padding:8px;
}

.profile{
  border-top:1px solid #292930;
  padding-top:14px;
  flex-shrink:0;
}

.profile-name{
  font-weight:700;
}

.profile-email{
  color:#777;
  font-size:12px;
  margin-top:3px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.logout{
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  border:1px solid #33333b;
  background:transparent;
  color:#ccc;
}

/* ================= MAIN ================= */

.main{
  flex:1;
  min-width:0;
  min-height:0;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}

.topbar{
  height:60px;
  min-height:60px;
  border-bottom:1px solid #292930;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  flex-shrink:0;
}

.menu-btn{
  display:none;
  border:0;
  background:transparent;
  color:#fff;
  font-size:22px;
}

.chat-title{
  font-weight:700;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.status{
  margin-left:auto;
  font-size:12px;
  color:#64e291;
}

/* ================= MESSAGES ================= */

.messages{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:22px 15px 180px;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}

.message{
  width:100%;
  max-width:850px;
  margin:0 auto 18px;
  display:flex;
  flex-direction:column;
}

.message.user{
  align-items:flex-end;
}

.message.assistant{
  align-items:flex-start;
}

.message-label{
  font-size:12px;
  color:#777;
  margin-bottom:6px;
}

.user .message-label{
  text-align:right;
}

.assistant .message-label{
  text-align:left;
}

.bubble{
  padding:12px 15px;
  border-radius:17px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
  max-width:min(75%,700px);
}

.user .bubble{
  background:#25252d;
  color:#fff;
  border-radius:18px 18px 5px 18px;
}

.assistant .bubble{
  background:#15151a;
  color:#fff;
  border:1px solid #292930;
  border-radius:18px 18px 18px 5px;
}

.message-image{
  display:block;
  width:100%;
  max-width:420px;
  max-height:420px;
  object-fit:contain;
  margin-top:8px;
  border-radius:14px;
  border:1px solid #38383f;
}

/* ================= THINKING ================= */

.ai-thinking{
  width:100%;
  max-width:850px;
  margin:0 auto 18px;
  display:flex;
  justify-content:flex-start;
}

.thinking-box{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:11px 14px;
  border:1px solid #292930;
  background:#15151a;
  border-radius:16px;
  color:#aaa;
  font-size:13px;
}

.thinking-dots{
  display:flex;
  gap:4px;
}

.thinking-dots span{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#aaa;
  animation:thinking 1.2s infinite;
}

.thinking-dots span:nth-child(2){
  animation-delay:.2s;
}

.thinking-dots span:nth-child(3){
  animation-delay:.4s;
}

@keyframes thinking{
  0%,60%,100%{
    opacity:.25;
    transform:translateY(0);
  }
  30%{
    opacity:1;
    transform:translateY(-3px);
  }
}

/* ================= GENERATED IMAGE ================= */

.generated-image{
  display:block;
  width:100%;
  max-width:650px;
  max-height:650px;
  object-fit:contain;
  margin-top:10px;
  border-radius:16px;
  border:1px solid #33333b;
}

/* ================= INPUT ================= */

.input-area{
  position:absolute;
  z-index:10;
  left:0;
  right:0;
  bottom:0;
  padding:12px 15px calc(15px + env(safe-area-inset-bottom));
  background:linear-gradient(
    transparent,
    #09090b 28%
  );
  pointer-events:none;
}

.composer{
  max-width:850px;
  margin:0 auto;
  background:#15151a;
  border:1px solid #303038;
  border-radius:18px;
  padding:10px;
  pointer-events:auto;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.tool-row{
  display:flex;
  gap:7px;
  margin-bottom:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.tool-row::-webkit-scrollbar{
  display:none;
}

.tool-btn{
  white-space:nowrap;
  border:1px solid #36363e;
  background:#1c1c22;
  color:#ddd;
  padding:7px 10px;
  border-radius:10px;
  font-size:12px;
}

.tool-btn.active{
  background:#fff;
  color:#000;
}

.composer-row{
  display:flex;
  gap:8px;
  align-items:flex-end;
}

#messageInput{
  flex:1;
  min-width:0;
  min-height:44px;
  max-height:150px;
  resize:none;
  border:0;
  outline:none;
  background:transparent;
  color:white;
  padding:11px;
  line-height:1.45;
}

.send-btn{
  width:44px;
  height:44px;
  flex-shrink:0;
  border:0;
  border-radius:12px;
  background:#fff;
  color:#000;
  font-size:18px;
}

.send-btn:disabled{
  opacity:.5;
}

.image-preview-box{
  display:none;
  margin-bottom:8px;
  position:relative;
  width:fit-content;
}

.image-preview-box img{
  max-width:130px;
  max-height:100px;
  border-radius:12px;
  border:1px solid #444;
}

.clear-image{
  position:absolute;
  top:-7px;
  right:-7px;
  width:23px;
  height:23px;
  border-radius:50%;
  border:0;
  background:#ff4d4d;
  color:white;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .sidebar{
    position:fixed;
    left:-280px;
    top:0;
    bottom:0;
    transition:left .25s ease;
    box-shadow:10px 0 30px rgba(0,0,0,.35);
  }

  .sidebar.open{
    left:0;
  }

  .menu-btn{
    display:block;
  }

  .bubble{
    max-width:82%;
  }

  .messages{
    padding-left:10px;
    padding-right:10px;
    padding-bottom:190px;
  }

  .input-area{
    padding-left:8px;
    padding-right:8px;
  }

  .composer{
    border-radius:16px;
  }

  .status{
    font-size:11px;
  }
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<div id="authScreen" class="auth-screen">

  <div class="auth-box">

    <div class="logo">EMORA AI</div>

    <div class="logo-sub">
      Your intelligent AI assistant
    </div>

    <div id="loginForm">

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button class="primary-btn" onclick="login()">
        Login
      </button>

      <div class="switch-auth">
        Don't have an account?
        <button onclick="showRegister()">
          Create account
        </button>
      </div>

    </div>

    <div id="registerForm" class="hidden">

      <input
        id="registerName"
        type="text"
        placeholder="Name"
        autocomplete="name"
      >

      <input
        id="registerEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="registerPassword"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
      >

      <button class="primary-btn" onclick="register()">
        Create account
      </button>

      <div class="switch-auth">
        Already have an account?
        <button onclick="showLogin()">
          Login
        </button>
      </div>

    </div>

  </div>
</div>

<!-- ================= APP ================= -->

<div id="app" class="app hidden">

  <aside id="sidebar" class="sidebar">

    <div class="sidebar-top">
      <div class="sidebar-logo">
        EMORA
      </div>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New Chat
    </button>

    <div class="recent-title">
      RECENT CHATS
    </div>

    <div id="chatList" class="chat-list"></div>

    <div class="profile">

      <div id="profileName" class="profile-name">
        User
      </div>

      <div id="profileEmail" class="profile-email">
        -
      </div>

      <button class="logout" onclick="logout()">
        Logout
      </button>

    </div>

  </aside>

  <main class="main">

    <div class="topbar">

      <button class="menu-btn" onclick="toggleSidebar()">
        ☰
      </button>

      <div id="chatTitle" class="chat-title">
        New Chat
      </div>

      <div class="status">
        ● Online
      </div>

    </div>

    <div id="messages" class="messages"></div>

    <div class="input-area">

      <div class="composer">

        <div
          id="imagePreviewBox"
          class="image-preview-box"
        >
          <img id="imagePreview" src="" alt="Selected image">

          <button
            class="clear-image"
            onclick="clearImage()"
          >
            ×
          </button>
        </div>

        <div class="tool-row">

          <button
            class="tool-btn"
            onclick="document.getElementById('imageUpload').click()"
          >
            🖼️ Image
          </button>

          <button
            id="micButton"
            class="tool-btn"
            onclick="toggleMic()"
          >
            🎙️ Mic
          </button>

          <button
            id="voiceButton"
            class="tool-btn active"
            onclick="toggleAutoVoice()"
          >
            🔊 Auto Voice ON
          </button>

          <button
            class="tool-btn"
            onclick="speakLastReply()"
          >
            ▶️ Replay
          </button>

          <button
            class="tool-btn"
            onclick="generateImage()"
          >
            🎨 Create Image
          </button>

        </div>

        <input
          id="imageUpload"
          type="file"
          accept="image/*"
          hidden
          onchange="handleImageUpload(event)"
        >

        <div class="composer-row">

          <textarea
            id="messageInput"
            placeholder="Message EMORA..."
            rows="1"
          ></textarea>

          <button
            id="sendButton"
            class="send-btn"
            onclick="sendMessage()"
          >
            ➤
          </button>

        </div>

      </div>

    </div>

  </main>

</div>

<script>

/* =========================================================
   CONFIG
========================================================= */

const API_BASE =
  window.location.origin;

/* =========================================================
   STATE
========================================================= */

let token =
  localStorage.getItem("emora_token") || null;

let currentUser = null;
let currentChatId = null;

let selectedImageData = null;
let selectedImageName = "";

let lastAssistantReply = "";

let autoVoice =
  localStorage.getItem("emora_auto_voice") !== "off";

let recognition = null;
let isListening = false;
let isSending = false;

/* =========================================================
   API
========================================================= */

async function api(endpoint, options = {}) {

  const headers = {
    ...(options.headers || {})
  };

  headers["Content-Type"] =
    "application/json";

  if (token) {
    headers["Authorization"] =
      "Bearer " + token;
  }

  const response =
    await fetch(
      API_BASE + endpoint,
      {
        ...options,
        headers
      }
    );

  let data = {};

  try {
    data = await response.json();
  } catch {
    data = {};
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      "Request failed."
    );
  }

  return data;
}

/* =========================================================
   AUTH UI
========================================================= */

function showLogin() {
  document
    .getElementById("loginForm")
    .classList.remove("hidden");

  document
    .getElementById("registerForm")
    .classList.add("hidden");
}

function showRegister() {
  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("registerForm")
    .classList.remove("hidden");
}

/* =========================================================
   REGISTER
========================================================= */

async function register() {

  const name =
    document
      .getElementById("registerName")
      .value.trim();

  const email =
    document
      .getElementById("registerEmail")
      .value.trim();

  const password =
    document
      .getElementById("registerPassword")
      .value;

  if (!name || !email || !password) {
    alert("Please fill all fields.");
    return;
  }

  try {

    const data =
      await api(
        "/register",
        {
          method:"POST",
          body:JSON.stringify({
            name,
            email,
            password
          })
        }
      );

    token = data.token;

    localStorage.setItem(
      "emora_token",
      token
    );

    currentUser = data.user;

    await showApp();

  } catch(error) {
    alert(error.message);
  }
}

/* =========================================================
   LOGIN
========================================================= */

async function login() {

  const email =
    document
      .getElementById("loginEmail")
      .value.trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  if (!email || !password) {
    alert("Please enter email and password.");
    return;
  }

  try {

    const data =
      await api(
        "/login",
        {
          method:"POST",
          body:JSON.stringify({
            email,
            password
          })
        }
      );

    token = data.token;

    localStorage.setItem(
      "emora_token",
      token
    );

    currentUser = data.user;

    await showApp();

  } catch(error) {
    alert(error.message);
  }
}

/* =========================================================
   SESSION
========================================================= */

async function checkSession() {

  if (!token) return;

  try {

    const data =
      await api("/me");

    currentUser =
      data.user;

    await showApp();

  } catch {

    token = null;

    localStorage.removeItem(
      "emora_token"
    );
  }
}

/* =========================================================
   SHOW APP
========================================================= */

async function showApp() {

  document
    .getElementById("authScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  document
    .getElementById("profileName")
    .textContent =
      currentUser?.name || "User";

  document
    .getElementById("profileEmail")
    .textContent =
      currentUser?.email || "";

  updateVoiceButton();

  await loadChats();

  if (!currentChatId) {
    newChat();
  }
}

/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

  try {
    await api(
      "/logout",
      {
        method:"POST"
      }
    );
  } catch {}

  token = null;
  currentUser = null;
  currentChatId = null;

  localStorage.removeItem(
    "emora_token"
  );

  location.reload();
}

/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar() {
  document
    .getElementById("sidebar")
    .classList.toggle("open");
}

/* =========================================================
   NEW CHAT
========================================================= */

function newChat() {

  currentChatId = null;
  lastAssistantReply = "";

  document
    .getElementById("chatTitle")
    .textContent =
      "New Chat";

  document
    .getElementById("messages")
    .innerHTML = "";

  clearImage();

  const input =
    document.getElementById(
      "messageInput"
    );

  input.value = "";
  input.focus();

  document
    .getElementById("sidebar")
    .classList.remove("open");
}

/* =========================================================
   LOAD CHATS
========================================================= */

async function loadChats() {

  try {

    const data =
      await api("/chats");

    const list =
      document.getElementById(
        "chatList"
      );

    list.innerHTML = "";

    data.chats.forEach(chat => {

      const item =
        document.createElement("div");

      item.className =
        "chat-item";

      const openButton =
        document.createElement("button");

      openButton.className =
        "chat-open";

      openButton.textContent =
        chat.title || "New Chat";

      openButton.onclick =
        () => loadChat(chat.id);

      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "chat-delete";

      deleteButton.textContent =
        "×";

      deleteButton.onclick =
        event => {
          event.stopPropagation();
          deleteChat(chat.id);
        };

      item.appendChild(openButton);
      item.appendChild(deleteButton);

      list.appendChild(item);
    });

  } catch(error) {
    console.error(error);
  }
}

/* =========================================================
   LOAD CHAT
========================================================= */

async function loadChat(chatId) {

  try {

    const data =
      await api(
        "/chats/" + chatId
      );

    currentChatId =
      chatId;

    document
      .getElementById("chatTitle")
      .textContent =
        data.chat.title ||
        "Chat";

    const messages =
      document.getElementById(
        "messages"
      );

    messages.innerHTML = "";

    lastAssistantReply = "";

    data.messages.forEach(message => {

      addMessage(
        message.role,
        message.content
      );

      if (
        message.role === "assistant"
      ) {
        lastAssistantReply =
          message.content;
      }
    });

    scrollMessagesToBottom();

    document
      .getElementById("sidebar")
      .classList.remove("open");

  } catch(error) {
    alert(error.message);
  }
}

/* =========================================================
   DELETE CHAT
========================================================= */

async function deleteChat(chatId) {

  if (!confirm("Delete this chat?")) {
    return;
  }

  try {

    await api(
      "/chats/" + chatId,
      {
        method:"DELETE"
      }
    );

    if (
      Number(currentChatId) ===
      Number(chatId)
    ) {
      newChat();
    }

    await loadChats();

  } catch(error) {
    alert(error.message);
  }
}

/* =========================================================
   SCROLL
========================================================= */

function scrollMessagesToBottom() {

  const box =
    document.getElementById(
      "messages"
    );

  requestAnimationFrame(() => {
    box.scrollTop =
      box.scrollHeight;
  });
}

/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
  role,
  content,
  imageData = null
) {

  const messages =
    document.getElementById(
      "messages"
    );

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " +
    (
      role === "assistant"
        ? "assistant"
        : "user"
    );

  const label =
    document.createElement("div");

  label.className =
    "message-label";

  label.textContent =
    role === "assistant"
      ? "EMORA"
      : "You";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  if (content) {
    const text =
      document.createElement("div");

    text.textContent =
      content;

    bubble.appendChild(text);
  }

  if (imageData) {

    const img =
      document.createElement("img");

    img.className =
      "message-image";

    img.src =
      imageData;

    img.alt =
      "Uploaded image";

    bubble.appendChild(img);
  }

  wrapper.appendChild(label);
  wrapper.appendChild(bubble);

  messages.appendChild(wrapper);

  scrollMessagesToBottom();
}

/* =========================================================
   THINKING
========================================================= */

function showTyping(show) {

  const existing =
    document.getElementById(
      "aiThinking"
    );

  if (show) {

    if (existing) return;

    const messages =
      document.getElementById(
        "messages"
      );

    const box =
      document.createElement("div");

    box.id =
      "aiThinking";

    box.className =
      "ai-thinking";

    box.innerHTML = `
      <div class="thinking-box">
        <span>EMORA is thinking</span>
        <div class="thinking-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    `;

    messages.appendChild(box);

    scrollMessagesToBottom();

  } else {

    if (existing) {
      existing.remove();
    }
  }
}

/* =========================================================
   SEND TEXT / IMAGE
========================================================= */

async function sendMessage() {

  if (isSending) return;

  const input =
    document.getElementById(
      "messageInput"
    );

  const message =
    input.value.trim();

  if (!message && !selectedImageData) {
    return;
  }

  isSending = true;

  document
    .getElementById("sendButton")
    .disabled = true;

  input.value = "";

  const imageToSend =
    selectedImageData;

  const prompt =
    message ||
    "Please analyze this image.";

  addMessage(
    "user",
    message || "Image",
    imageToSend
  );

  clearImage();

  showTyping(true);

  try {

    let data;

    if (imageToSend) {

      data =
        await api(
          "/analyze-image",
          {
            method:"POST",

            body:JSON.stringify({
              image:
                imageToSend,

              prompt
            })
          }
        );

      showTyping(false);

      lastAssistantReply =
        data.reply;

      addMessage(
        "assistant",
        data.reply
      );

      if (autoVoice) {
        speakText(data.reply);
      }

    } else {

      data =
        await api(
          "/chat",
          {
            method:"POST",

            body:JSON.stringify({
              message,
              chatId:
                currentChatId
            })
          }
        );

      showTyping(false);

      currentChatId =
        data.chatId;

      document
        .getElementById("chatTitle")
        .textContent =
          data.chat?.title ||
          "Chat";

      lastAssistantReply =
        data.reply;

      addMessage(
        "assistant",
        data.reply
      );

      if (autoVoice) {
        speakText(data.reply);
      }

      await loadChats();
    }

  } catch(error) {

    showTyping(false);

    addMessage(
      "assistant",
      "Sorry, something went wrong: " +
      error.message
    );

  } finally {

    isSending = false;

    document
      .getElementById("sendButton")
      .disabled = false;

    input.focus();
  }
}

/* =========================================================
   ENTER
========================================================= */

document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();
      }
    }
  );

document

/* =========================================================
   IMAGE RESIZE
========================================================= */

function compressImage(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload = event => {

        const img =
          new Image();

        img.onload = () => {

          const maxSize = 1600;

          let width =
            img.width;

          let height =
            img.height;

          if (
            width > maxSize ||
            height > maxSize
          ) {

            const ratio =
              Math.min(
                maxSize / width,
                maxSize / height
              );

            width =
              Math.round(
                width * ratio
              );

            height =
              Math.round(
                height * ratio
              );
          }

          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            width;

          canvas.height =
            height;

          const ctx =
            canvas.getContext(
              "2d"
            );

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );

          resolve(
            canvas.toDataURL(
              "image/jpeg",
              .82
            )
          );
        };

        img.onerror =
          () => reject(
            new Error(
              "Could not read image."
            )
          );

        img.src =
          event.target.result;
      };

      reader.onerror =
        () => reject(
          new Error(
            "Could not load image."
          )
        );

      reader.readAsDataURL(file);
    }
  );
}

/* =========================================================
   IMAGE SELECT
========================================================= */

async function handleImageUpload(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {

    alert(
      "Please select an image."
    );

    return;
  }

  try {

    selectedImageData =
      await compressImage(file);

    selectedImageName =
      file.name;

    document
      .getElementById("imagePreview")
      .src =
        selectedImageData;

    document
      .getElementById("imagePreviewBox")
      .style.display =
        "block";

  } catch(error) {

    selectedImageData = null;

    alert(
      error.message
    );
  }
}

function clearImage() {

  selectedImageData = null;
  selectedImageName = "";

  const input =
    document.getElementById(
      "imageUpload"
    );

  input.value = "";

  document
    .getElementById("imagePreview")
    .src = "";

  document
    .getElementById("imagePreviewBox")
    .style.display =
      "none";
}

/* =========================================================
   MICROPHONE
========================================================= */

function setupRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    return false;
  }

  recognition =
    new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.lang =
    "bn-BD";

  recognition.onstart =
    () => {

      isListening = true;

      const button =
        document.getElementById(
          "micButton"
        );

      button.textContent =
        "🔴 Listening...";

      button.classList.add(
        "active"
      );
    };

  recognition.onresult =
    event => {

      let transcript = "";

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        transcript +=
          event.results[i][0].transcript;
      }

      const input =
        document.getElementById(
          "messageInput"
        );

      input.value =
        transcript;

      input.dispatchEvent(
        new Event("input")
      );
    };

  recognition.onerror =
    event => {

      console.error(
        "Speech recognition:",
        event.error
      );

      if (
        event.error ===
        "not-allowed"
      ) {
        alert(
          "Microphone permission was denied. Please allow microphone access in your browser."
        );
      }
    };

  recognition.onend =
    () => {

      isListening = false;

      const button =
        document.getElementById(
          "micButton"
        );

      button.textContent =
        "🎙️ Mic";

      button.classList.remove(
        "active"
      );
    };

  return true;
}

function toggleMic() {

  if (!recognition) {

    const supported =
      setupRecognition();

    if (!supported) {

      alert(
        "Voice input is not supported by this browser."
      );

      return;
    }
  }

  if (isListening) {

    recognition.stop();

    return;
  }

  try {

    recognition.lang =
      /[\u0980-\u09FF]/.test(
        document.getElementById(
          "messageInput"
        ).value
      )
        ? "bn-BD"
        : "bn-BD";

    recognition.start();

  } catch(error) {

    console.error(error);
  }
}

/* =========================================================
   AUTO VOICE
========================================================= */

function updateVoiceButton() {

  const button =
    document.getElementById(
      "voiceButton"
    );

  if (!button) return;

  if (autoVoice) {

    button.textContent =
      "🔊 Auto Voice ON";

    button.classList.add(
      "active"
    );

  } else {

    button.textContent =
      "🔇 Auto Voice OFF";

    button.classList.remove(
      "active"
    );
  }
}

function toggleAutoVoice() {

  autoVoice =
    !autoVoice;

  localStorage.setItem(
    "emora_auto_voice",
    autoVoice
      ? "on"
      : "off"
  );

  updateVoiceButton();

  if (!autoVoice &&
      "speechSynthesis" in window) {

    window.speechSynthesis.cancel();
  }
}

function getBestVoice(language) {

  if (
    !("speechSynthesis" in window)
  ) {
    return null;
  }

  const voices =
    window.speechSynthesis
      .getVoices();

  if (!voices.length) {
    return null;
  }

  const wanted =
    language
      .toLowerCase();

  let voice =
    voices.find(
      v =>
        v.lang &&
        v.lang.toLowerCase() ===
        wanted
    );

  if (voice) return voice;

  voice =
    voices.find(
      v =>
        v.lang &&
        v.lang
          .toLowerCase()
          .startsWith(
            wanted.split("-")[0]
          )
    );

  return voice || null;
}

function speakText(text) {

  if (!text) return;

  if (
    !("speechSynthesis" in window)
  ) {
    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(
      text
    );

  const bengali =
    /[\u0980-\u09FF]/.test(text);

  speech.lang =
    bengali
      ? "bn-BD"
      : "en-US";

  speech.rate = 1;
  speech.pitch = 1;

  const voice =
    getBestVoice(
      speech.lang
    );

  if (voice) {
    speech.voice = voice;
  }

  window.speechSynthesis.speak(
    speech
  );
}

function speakLastReply() {

  if (!lastAssistantReply) {

    alert(
      "There is no AI reply to read yet."
    );

    return;
  }

  speakText(
    lastAssistantReply
  );
}

/* =========================================================
   IMAGE GENERATION
========================================================= */

async function generateImage() {

  const prompt =
    window.prompt(
      "What image should EMORA create?"
    );

  if (!prompt || !prompt.trim()) {
    return;
  }

  const messages =
    document.getElementById(
      "messages"
    );

  const loading =
    document.createElement("div");

  loading.className =
    "ai-thinking";

  loading.id =
    "imageGenerating";

  loading.innerHTML = `
    <div class="thinking-box">
      <span>EMORA is creating your image</span>
      <div class="thinking-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  `;

  messages.appendChild(
    loading
  );

  scrollMessagesToBottom();

  try {

    const data =
      await api(
        "/generate-image",
        {
          method:"POST",

          body:JSON.stringify({
            prompt
          })
        }
      );

    loading.remove();

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message assistant";

    const label =
      document.createElement("div");

    label.className =
      "message-label";

    label.textContent =
      "EMORA";

    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    const title =
      document.createElement("div");

    title.textContent =
      "Image created";

    bubble.appendChild(
      title
    );

    let imageSrc = null;

    if (
      data.image &&
      data.image.type ===
      "base64"
    ) {

      imageSrc =
        "data:image/png;base64," +
        data.image.data;

    } else if (
      data.image &&
      data.image.type ===
      "url"
    ) {

      imageSrc =
        data.image.url;
    }

    if (imageSrc) {

      const img =
        document.createElement(
          "img"
        );

      img.className =
        "generated-image";

      img.src =
        imageSrc;

      img.alt =
        prompt;

      bubble.appendChild(
        img
      );
    }

    wrapper.appendChild(
      label
    );

    wrapper.appendChild(
      bubble
    );

    messages.appendChild(
      wrapper
    );

    scrollMessagesToBottom();

  } catch(error) {

    loading.remove();

    addMessage(
      "assistant",
      "Image generation failed: " +
      error.message
    );
  }
}
