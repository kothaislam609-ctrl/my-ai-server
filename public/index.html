<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMORA AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #09090b;
  color: #fff;
  height: 100vh;
  overflow: hidden;
}

button,
textarea,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}


/* =========================================================
   AUTH
========================================================= */

.auth-screen {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at top, #24243a 0%, #09090b 55%);
}

.auth-box {
  width: 100%;
  max-width: 390px;
  background: rgba(25, 25, 30, 0.95);
  border: 1px solid #303038;
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}

.logo {
  text-align: center;
  font-size: 32px;
  font-weight: 800;
  margin-bottom: 8px;
}

.logo-sub {
  text-align: center;
  color: #999;
  margin-bottom: 25px;
}

.auth-box input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: 12px;
  border: 1px solid #3b3b44;
  background: #111116;
  color: white;
  outline: none;
}

.auth-box input:focus {
  border-color: #7777ff;
}

.primary-btn {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  background: #ffffff;
  color: #080808;
  font-weight: 700;
}

.switch-auth {
  margin-top: 18px;
  text-align: center;
  color: #aaa;
}

.switch-auth button {
  background: none;
  border: 0;
  color: #fff;
  font-weight: 700;
}


/* =========================================================
   APP
========================================================= */

.app {
  display: flex;
  height: 100vh;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
  width: 270px;
  background: #101014;
  border-right: 1px solid #292930;
  display: flex;
  flex-direction: column;
  padding: 15px;
  flex-shrink: 0;
}

.sidebar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 15px;
}

.sidebar-logo {
  font-size: 21px;
  font-weight: 800;
}

.new-chat {
  width: 100%;
  padding: 12px;
  border: 1px solid #36363e;
  border-radius: 12px;
  background: #19191f;
  color: white;
  margin-bottom: 15px;
}

.new-chat:hover {
  background: #222229;
}

.recent-title {
  color: #777;
  font-size: 12px;
  margin: 5px 4px 8px;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
}

.chat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
}

.chat-open {
  flex: 1;
  border: 0;
  background: transparent;
  color: #ccc;
  text-align: left;
  padding: 11px;
  border-radius: 10px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.chat-open:hover {
  background: #1c1c22;
  color: white;
}

.chat-delete {
  border: 0;
  background: transparent;
  color: #777;
  padding: 8px;
}

.chat-delete:hover {
  color: #ff6b6b;
}

.profile {
  border-top: 1px solid #292930;
  padding-top: 14px;
}

.profile-name {
  font-weight: 700;
}

.profile-email {
  color: #777;
  font-size: 12px;
  margin-top: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.logout {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #33333b;
  background: transparent;
  color: #ccc;
}


/* =========================================================
   MAIN
========================================================= */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 60px;
  border-bottom: 1px solid #292930;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  flex-shrink: 0;
}

.menu-btn {
  display: none;
  border: 0;
  background: transparent;
  color: white;
  font-size: 22px;
}

.status {
  font-size: 12px;
  color: #64e291;
}

.chat-title {
  font-weight: 700;
}


/* =========================================================
   CHAT
========================================================= */

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 22px 15px 120px;
}

.message {
  max-width: 850px;
  margin: 0 auto 18px;
}

.message-label {
  font-size: 12px;
  color: #777;
  margin-bottom: 6px;
}

.bubble {
  display: inline-block;
  max-width: 90%;
  padding: 12px 15px;
  border-radius: 16px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
}

.user .bubble {
  background: #25252d;
}

.assistant .bubble {
  background: #15151a;
  border: 1px solid #292930;
}


/* =========================================================
   THINKING
========================================================= */

.ai-thinking {
  max-width: 850px;
  margin: 0 auto 18px;
}

.thinking-box {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 14px;
  border: 1px solid #292930;
  background: #15151a;
  border-radius: 16px;
  color: #aaa;
  font-size: 13px;
}

.thinking-dots {
  display: flex;
  gap: 4px;
}

.thinking-dots span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #aaa;
  animation: thinking 1.2s infinite;
}

.thinking-dots span:nth-child(2) {
  animation-delay: .2s;
}

.thinking-dots span:nth-child(3) {
  animation-delay: .4s;
}

@keyframes thinking {
  0%, 60%, 100% {
    opacity: .25;
    transform: translateY(0);
  }

  30% {
    opacity: 1;
    transform: translateY(-3px);
  }
}


/* =========================================================
   IMAGE
========================================================= */

.generated-image {
  display: block;
  width: 100%;
  max-width: 650px;
  margin-top: 10px;
  border-radius: 16px;
  border: 1px solid #33333b;
}


/* =========================================================
   INPUT AREA
========================================================= */

.input-area {
  position: fixed;
  left: 270px;
  right: 0;
  bottom: 0;
  padding: 12px 15px 15px;
  background: linear-gradient(
    transparent,
    #09090b 25%
  );
}

.composer {
  max-width: 850px;
  margin: 0 auto;
  background: #15151a;
  border: 1px solid #303038;
  border-radius: 18px;
  padding: 10px;
}

.tool-row {
  display: flex;
  gap: 7px;
  margin-bottom: 8px;
  overflow-x: auto;
}

.tool-btn {
  white-space: nowrap;
  border: 1px solid #36363e;
  background: #1c1c22;
  color: #ddd;
  padding: 7px 10px;
  border-radius: 10px;
  font-size: 12px;
}

.tool-btn:hover {
  background: #27272f;
}

.composer-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

#messageInput {
  flex: 1;
  min-height: 44px;
  max-height: 150px;
  resize: none;
  border: 0;
  outline: none;
  background: transparent;
  color: white;
  padding: 11px;
}

.send-btn {
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 12px;
  background: white;
  color: black;
  font-size: 18px;
}

.image-preview-box {
  display: none;
  margin-bottom: 8px;
  position: relative;
  width: fit-content;
}

.image-preview-box img {
  max-width: 130px;
  max-height: 100px;
  border-radius: 12px;
  border: 1px solid #444;
}

.clear-image {
  position: absolute;
  top: -7px;
  right: -7px;
  width: 23px;
  height: 23px;
  border-radius: 50%;
  border: 0;
  background: #ff4d4d;
  color: white;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

  .sidebar {
    position: fixed;
    z-index: 20;
    left: -280px;
    top: 0;
    bottom: 0;
    transition: .25s;
  }

  .sidebar.open {
    left: 0;
  }

  .menu-btn {
    display: block;
  }

  .input-area {
    left: 0;
  }

  .messages {
    padding-bottom: 145px;
  }
}
</style>
</head>

<body>


<!-- =======================================================
     AUTH SCREEN
======================================================= -->

<div id="authScreen" class="auth-screen">

  <div class="auth-box">

    <div class="logo">
      EMORA AI
    </div>

    <div class="logo-sub">
      Your intelligent AI assistant
    </div>


    <!-- LOGIN -->

    <div id="loginForm">

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        class="primary-btn"
        onclick="login()"
      >
        Login
      </button>

      <div class="switch-auth">
        Don't have an account?
        <button onclick="showRegister()">
          Create account
        </button>
      </div>

    </div>


    <!-- REGISTER -->

    <div id="registerForm" class="hidden">

      <input
        id="registerName"
        type="text"
        placeholder="Name"
        autocomplete="name"
      >

      <input
        id="registerEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="registerPassword"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
      >

      <button
        class="primary-btn"
        onclick="register()"
      >
        Create account
      </button>

      <div class="switch-auth">
        Already have an account?
        <button onclick="showLogin()">
          Login
        </button>
      </div>

    </div>

  </div>
</div>


<!-- =======================================================
     APP
======================================================= -->

<div id="app" class="app hidden">


  <!-- SIDEBAR -->

  <aside id="sidebar" class="sidebar">

    <div class="sidebar-top">

      <div class="sidebar-logo">
        EMORA
      </div>

    </div>


    <button
      class="new-chat"
      onclick="newChat()"
    >
      ＋ New Chat
    </button>


    <div class="recent-title">
      RECENT CHATS
    </div>


    <div
      id="chatList"
      class="chat-list"
    ></div>


    <div class="profile">

      <div
        id="profileName"
        class="profile-name"
      >
        User
      </div>

      <div
        id="profileEmail"
        class="profile-email"
      >
        -
      </div>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">


    <!-- TOPBAR -->

    <div class="topbar">

      <button
        class="menu-btn"
        onclick="toggleSidebar()"
      >
        ☰
      </button>

      <div
        id="chatTitle"
        class="chat-title"
      >
        New Chat
      </div>

      <div class="status">
        ● Online
      </div>

    </div>


    <!-- MESSAGES -->

    <div
      id="messages"
      class="messages"
    ></div>


    <!-- INPUT -->

    <div class="input-area">

      <div class="composer">


        <!-- IMAGE PREVIEW -->

        <div
          id="imagePreviewBox"
          class="image-preview-box"
        >

          <img
            id="imagePreview"
            src=""
            alt="Selected image"
          >

          <button
            class="clear-image"
            onclick="clearImage()"
          >
            ×
          </button>

        </div>


        <!-- TOOLS -->

        <div class="tool-row">

          <button
            class="tool-btn"
            onclick="document.getElementById('imageUpload').click()"
          >
            🖼️ Image
          </button>

          <button
            class="tool-btn"
            onclick="generateImage()"
          >
            🎨 Create Image
          </button>

          <button
            class="tool-btn"
            onclick="speakLastReply()"
          >
            🔊 Voice
          </button>

        </div>


        <input
          id="imageUpload"
          type="file"
          accept="image/*"
          hidden
          onchange="handleImageUpload(event)"
        >


        <div class="composer-row">

          <textarea
            id="messageInput"
            placeholder="Message EMORA..."
            rows="1"
          ></textarea>

          <button
            class="send-btn"
            onclick="sendMessage()"
          >
            ➤
          </button>

        </div>

      </div>

    </div>

  </main>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_BASE =
  window.location.origin;


/* =========================================================
   STATE
========================================================= */

let token =
  localStorage.getItem("emora_token") || null;

let currentUser =
  null;

let currentChatId =
  null;

let selectedImageFile =
  null;

let lastAssistantReply =
  "";


/* =========================================================
   API
========================================================= */

async function api(
  endpoint,
  options = {}
) {

  const headers =
    options.headers || {};

  headers["Content-Type"] =
    "application/json";

  if (token) {
    headers["Authorization"] =
      "Bearer " + token;
  }

  const response =
    await fetch(
      API_BASE + endpoint,
      {
        ...options,
        headers
      }
    );

  let data = {};

  try {
    data =
      await response.json();
  } catch {
    data = {};
  }

  if (!response.ok) {

    throw new Error(
      data.error ||
      "Request failed."
    );
  }

  return data;
}


/* =========================================================
   AUTH UI
========================================================= */

function showLogin() {

  document
    .getElementById("loginForm")
    .classList.remove("hidden");

  document
    .getElementById("registerForm")
    .classList.add("hidden");
}


function showRegister() {

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("registerForm")
    .classList.remove("hidden");
}


/* =========================================================
   REGISTER
========================================================= */

async function register() {

  const name =
    document
      .getElementById("registerName")
      .value
      .trim();

  const email =
    document
      .getElementById("registerEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("registerPassword")
      .value;

  if (!name || !email || !password) {
    alert("Please fill all fields.");
    return;
  }

  try {

    const data =
      await api(
        "/register",
        {
          method: "POST",

          body: JSON.stringify({
            name,
            email,
            password
          })
        }
      );

    token =
      data.token;

    localStorage.setItem(
      "emora_token",
      token
    );

    currentUser =
      data.user;

    showApp();

  } catch (error) {

    alert(error.message);
  }
}


/* =========================================================
   LOGIN
========================================================= */

async function login() {

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  if (!email || !password) {
    alert("Please enter email and password.");
    return;
  }

  try {

    const data =
      await api(
        "/login",
        {
          method: "POST",

          body: JSON.stringify({
            email,
            password
          })
        }
      );

    token =
      data.token;

    localStorage.setItem(
      "emora_token",
      token
    );

    currentUser =
      data.user;

    showApp();

  } catch (error) {

    alert(error.message);
  }
}


/* =========================================================
   AUTO LOGIN
========================================================= */

async function checkSession() {

  if (!token) {
    return;
  }

  try {

    const data =
      await api("/me");

    currentUser =
      data.user;

    showApp();

  } catch {

    token = null;

    localStorage.removeItem(
      "emora_token"
    );
  }
}


/* =========================================================
   SHOW APP
========================================================= */

async function showApp() {

  document
    .getElementById("authScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  document
    .getElementById("profileName")
    .textContent =
      currentUser?.name || "User";

  document
    .getElementById("profileEmail")
    .textContent =
      currentUser?.email || "";

  await loadChats();

  if (!currentChatId) {
    newChat();
  }
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

  try {

    await api(
      "/logout",
      {
        method: "POST"
      }
    );

  } catch {}

  token = null;
  currentUser = null;
  currentChatId = null;

  localStorage.removeItem(
    "emora_token"
  );

  location.reload();
}


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar() {

  document
    .getElementById("sidebar")
    .classList.toggle("open");
}


/* =========================================================
   NEW CHAT
========================================================= */

function newChat() {

  currentChatId = null;

  document
    .getElementById("chatTitle")
    .textContent =
      "New Chat";

  document
    .getElementById("messages")
    .innerHTML = "";

  document
    .getElementById("messageInput")
    .focus();

  clearImage();

  document
    .getElementById("sidebar")
    .classList.remove("open");
}


/* =========================================================
   LOAD CHATS
========================================================= */

async function loadChats() {

  try {

    const data =
      await api("/chats");

    const list =
      document.getElementById("chatList");

    list.innerHTML = "";

    data.chats.forEach(chat => {

      const item =
        document.createElement("div");

      item.className =
        "chat-item";


      const openButton =
        document.createElement("button");

      openButton.className =
        "chat-open";

      openButton.textContent =
        chat.title || "New Chat";

      openButton.onclick =
        () => loadChat(chat.id);


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "chat-delete";

      deleteButton.textContent =
        "×";

      deleteButton.onclick =
        event => {

          event.stopPropagation();

          deleteChat(chat.id);
        };


      item.appendChild(
        openButton
      );

      item.appendChild(
        deleteButton
      );

      list.appendChild(
        item
      );
    });

  } catch (error) {

    console.error(error);
  }
}


/* =========================================================
   LOAD CHAT
========================================================= */

async function loadChat(chatId) {

  try {

    const data =
      await api(
        "/chats/" + chatId
      );

    currentChatId =
      chatId;

    document
      .getElementById("chatTitle")
      .textContent =
        data.chat.title ||
        "Chat";

    const messages =
      document.getElementById("messages");

    messages.innerHTML = "";

    data.messages.forEach(message => {

      addMessage(
        message.role,
        message.content
      );

      if (
        message.role === "assistant"
      ) {

        lastAssistantReply =
          message.content;
      }
    });

    messages.scrollTop =
      messages.scrollHeight;

    document
      .getElementById("sidebar")
      .classList.remove("open");

  } catch (error) {

    alert(error.message);
  }
}


/* =========================================================
   DELETE CHAT
========================================================= */

async function deleteChat(chatId) {

  if (
    !confirm(
      "Delete this chat?"
    )
  ) {
    return;
  }

  try {

    await api(
      "/chats/" + chatId,
      {
        method: "DELETE"
      }
    );

    if (
      Number(currentChatId) ===
      Number(chatId)
    ) {

      newChat();
    }

    await loadChats();

  } catch (error) {

    alert(error.message);
  }
}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
  role,
  content
) {

  const messages =
    document.getElementById(
      "messages"
    );

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " +
    (
      role === "assistant"
        ? "assistant"
        : "user"
    );


  const label =
    document.createElement("div");

  label.className =
    "message-label";

  label.textContent =
    role === "assistant"
      ? "EMORA"
      : "You";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    content;


  wrapper.appendChild(
    label
  );

  wrapper.appendChild(
    bubble
  );

  messages.appendChild(
    wrapper
  );

  messages.scrollTop =
    messages.scrollHeight;
}


/* =========================================================
   THINKING
========================================================= */

function showTyping(show) {

  const existing =
    document.getElementById(
      "aiThinking"
    );

  if (show) {

    if (existing) {
      return;
    }

    const messages =
      document.getElementById(
        "messages"
      );

    const box =
      document.createElement("div");

    box.id =
      "aiThinking";

    box.className =
      "ai-thinking";

    box.innerHTML = `
      <div class="thinking-box">
        <span>EMORA is thinking</span>
        <div class="thinking-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    `;

    messages.appendChild(box);

    messages.scrollTop =
      messages.scrollHeight;

  } else {

    if (existing) {
      existing.remove();
    }
  }
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );

  const message =
    input.value.trim();

  if (!message) {
    return;
  }

  input.value = "";

  addMessage(
    "user",
    message
  );

  showTyping(true);

  try {

    const data =
      await api(
        "/chat",
        {
          method: "POST",

          body: JSON.stringify({
            message,
            chatId:
              currentChatId
          })
        }
      );

    showTyping(false);

    currentChatId =
      data.chatId;

    document
      .getElementById("chatTitle")
      .textContent =
        data.chat?.title ||
        "Chat";

    lastAssistantReply =
      data.reply;

    addMessage(
      "assistant",
      data.reply
    );

    await loadChats();

  } catch (error) {

    showTyping(false);

    addMessage(
      "assistant",
      "Sorry, something went wrong: " +
      error.message
    );
  }
}


/* =========================================================
   ENTER TO SEND
========================================================= */

document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();
      }
    }
  );


/* =========================================================
   IMAGE UPLOAD PREVIEW
========================================================= */

function handleImageUpload(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }

  if (
    !file.type.startsWith("image/")
  ) {

    alert(
      "Please select an image."
    );

    return;
  }

  selectedImageFile =
    file;

  const reader =
    new FileReader();

  reader.onload =
    function(e) {

      document
        .getElementById(
          "imagePreview"
        )
        .src =
          e.target.result;

      document
        .getElementById(
          "imagePreviewBox"
        )
        .style.display =
          "block";
    };

  reader.readAsDataURL(file);
}


function clearImage() {

  selectedImageFile =
    null;

  document
    .getElementById(
      "imageUpload"
    )
    .value = "";

  document
    .getElementById(
      "imagePreview"
    )
    .src = "";

  document
    .getElementById(
      "imagePreviewBox"
    )
    .style.display =
      "none";
}


/* =========================================================
   AI IMAGE GENERATION
========================================================= */

async function generateImage() {

  const prompt =
    window.prompt(
      "What image should EMORA create?"
    );

  if (!prompt || !prompt.trim()) {
    return;
  }

  const messages =
    document.getElementById(
      "messages"
    );

  const loading =
    document.createElement("div");

  loading.className =
    "ai-thinking";

  loading.id =
    "imageGenerating";

  loading.innerHTML = `
    <div class="thinking-box">
      <span>EMORA is creating your image</span>
      <div class="thinking-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  `;

  messages.appendChild(
    loading
  );

  messages.scrollTop =
    messages.scrollHeight;


  try {

    const data =
      await api(
        "/generate-image",
        {
          method: "POST",

          body: JSON.stringify({
            prompt
          })
        }
      );

    loading.remove();


    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message assistant";


    const label =
      document.createElement("div");

    label.className =
      "message-label";

    label.textContent =
      "EMORA";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.textContent =
      "Image created";


    wrapper.appendChild(
      label
    );

    wrapper.appendChild(
      bubble
    );


    if (
      data.image &&
      data.image.type === "base64"
    ) {

      const img =
        document.createElement("img");

      img.className =
        "generated-image";

      img.src =
        "data:image/png;base64," +
        data.image.data;

      img.alt =
        prompt;

      bubble.appendChild(
        document.createElement("br")
      );

      bubble.appendChild(
        img
      );

    } else if (
      data.image &&
      data.image.type === "url"
    ) {

      const img =
        document.createElement("img");

      img.className =
        "generated-image";

      img.src =
        data.image.url;

      img.alt =
        prompt;

      bubble.appendChild(
        document.createElement("br")
      );

      bubble.appendChild(
        img
      );
    }


    messages.appendChild(
      wrapper
    );

    messages.scrollTop =
      messages.scrollHeight;

  } catch (error) {

    loading.remove();

    addMessage(
      "assistant",
      "Image generation failed: " +
      error.message
    );
  }
}


/* =========================================================
   VOICE REPLY
========================================================= */

function speakLastReply() {

  if (!lastAssistantReply) {

    alert(
      "There is no AI reply to read yet."
    );

    return;
  }

  if (
    !("speechSynthesis" in window)
  ) {

    alert(
      "Voice playback is not supported on this browser."
    );

    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(
      lastAssistantReply
    );

  speech.lang =
    /[\u0980-\u09FF]/.test(
      lastAssistantReply
    )
      ? "bn-BD"
      : "en-US";

  speech.rate = 1;
  speech.pitch = 1;

  window.speechSynthesis.speak(
    speech
  );
}

   START
========================================================= */

checkSession();
