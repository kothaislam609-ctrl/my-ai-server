<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMORA AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b10;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* LOGIN */
    #loginPage {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, #302050 0, transparent 45%),
        #08080d;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 30px 24px;
      border: 1px solid #292936;
      border-radius: 24px;
      background: rgba(20, 20, 29, .94);
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9b9ba8;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .input {
      width: 100%;
      padding: 14px 15px;
      margin-bottom: 13px;
      border: 1px solid #30303d;
      border-radius: 13px;
      outline: none;
      background: #111118;
      color: white;
    }

    .input:focus {
      border-color: #8b5cf6;
    }

    .main-btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      background: linear-gradient(135deg,#8b5cf6,#6366f1);
      color: white;
      font-weight: bold;
      margin-top: 5px;
    }

    .switch {
      text-align: center;
      color: #9999a5;
      margin-top: 18px;
      font-size: 14px;
    }

    .switch span {
      color: #a78bfa;
      cursor: pointer;
      font-weight: bold;
    }

    #authMessage {
      text-align: center;
      color: #ff7373;
      margin-top: 12px;
      font-size: 13px;
      min-height: 18px;
    }

    /* APP */
    #app {
      display: none;
      height: 100vh;
    }

    .app {
      display: flex;
      height: 100%;
    }

    /* SIDEBAR */
    .sidebar {
      width: 280px;
      background: #101017;
      border-right: 1px solid #252530;
      display: flex;
      flex-direction: column;
      padding: 15px;
      flex-shrink: 0;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 10px 8px 18px;
    }

    .new-chat {
      border: 1px solid #343442;
      background: #191922;
      color: white;
      border-radius: 13px;
      padding: 12px;
      margin-bottom: 18px;
      text-align: left;
    }

    .new-chat:hover {
      background: #22222e;
    }

    .history-title {
      color: #777784;
      font-size: 12px;
      margin: 0 8px 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #chatList {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 11px 9px;
      border-radius: 11px;
      margin-bottom: 4px;
      color: #c9c9d3;
    }

    .chat-item:hover,
    .chat-item.active {
      background: #1e1e29;
      color: white;
    }

    .chat-title {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 14px;
    }

    .delete-chat {
      border: 0;
      background: transparent;
      color: #777784;
      padding: 4px;
    }

    .delete-chat:hover {
      color: #ff6262;
    }

    .profile {
      border-top: 1px solid #292934;
      padding-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg,#8b5cf6,#ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .profile-info {
      flex: 1;
      overflow: hidden;
    }

    .profile-name {
      font-size: 14px;
      font-weight: bold;
    }

    .profile-email {
      color: #777784;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .logout {
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 12px;
      padding: 5px;
    }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 60px;
      border-bottom: 1px solid #252530;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      background: #0e0e14;
    }

    .menu-btn {
      display: none;
      border: 0;
      background: transparent;
      color: white;
      font-size: 24px;
    }

    .top-title {
      font-weight: bold;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #8f8f9d;
      font-size: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
    }

    /* CHAT */
    #chatArea {
      flex: 1;
      overflow-y: auto;
      padding: 25px 15px 130px;
    }

    .welcome {
      max-width: 700px;
      margin: 10vh auto 0;
      text-align: center;
    }

    .welcome-logo {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #92929e;
      line-height: 1.6;
    }

    .messages {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    .message {
      display: flex;
      gap: 12px;
      margin: 18px 0;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #242431;
      font-size: 14px;
    }

    .user .message-avatar {
      order: 2;
      background: #4f46e5;
    }

    .bubble {
      max-width: min(760px, 82%);
      padding: 12px 15px;
      border-radius: 16px;
      background: #171720;
      border: 1px solid #282834;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #29234a;
      border-color: #41376d;
    }

    /* TYPING */
    .typing {
      display: none;
      width: 100%;
      max-width: 850px;
      margin: 10px auto;
      color: #8e8e9c;
      font-size: 13px;
    }

    .typing span {
      display: inline-block;
      animation: blink 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .2s;
    }

    .typing span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {
      0%,100% { opacity: .2; }
      50% { opacity: 1; }
    }

    /* INPUT */
    .composer-wrap {
      position: fixed;
      bottom: 0;
      left: 280px;
      right: 0;
      padding: 12px 15px 18px;
      background: linear-gradient(transparent,#0b0b10 30%);
    }

    .composer {
      max-width: 850px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 9px;
      border: 1px solid #343440;
      border-radius: 17px;
      background: #14141c;
    }

    #messageInput {
      flex: 1;
      min-height: 42px;
      max-height: 140px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      padding: 10px;
    }

    #messageInput::placeholder {
      color: #70707d;
    }

    #sendBtn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      background: #7654e8;
      color: white;
      font-size: 18px;
    }

    #sendBtn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .small-note {
      max-width: 850px;
      margin: 6px auto 0;
      text-align: center;
      color: #5f5f6b;
      font-size: 10px;
    }

    /* MOBILE */
    @media (max-width: 700px) {
      .sidebar {
        position: fixed;
        z-index: 20;
        top: 0;
        bottom: 0;
        left: -290px;
        transition: .25s;
        box-shadow: 10px 0 40px rgba(0,0,0,.5);
      }

      .sidebar.open {
        left: 0;
      }

      .menu-btn {
        display: block;
      }

      .composer-wrap {
        left: 0;
      }

      .bubble {
        max-width: 86%;
      }

      .welcome h1 {
        font-size: 25px;
      }
    }

    .loading {
      opacity: .6;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginPage">
    <div class="login-box">

      <div class="logo">EMORA</div>
      <div class="subtitle">Your intelligent AI assistant</div>

      <div id="registerFields" style="display:none;">
        <input id="nameInput" class="input" type="text" placeholder="Your name">
      </div>

      <input id="emailInput" class="input" type="email" placeholder="Email">
      <input id="passwordInput" class="input" type="password" placeholder="Password">

      <button id="authBtn" class="main-btn" onclick="handleAuth()">
        Login
      </button>

      <div id="authMessage"></div>

      <div class="switch">
        <span id="switchText">Don't have an account?</span>
        <span id="switchBtn" onclick="toggleAuth()"> Create account</span>
      </div>

    </div>
  </section>


  <!-- APP -->
  <section id="app">

    <div class="app">

      <!-- SIDEBAR -->
      <aside id="sidebar" class="sidebar">

        <div class="brand">EMORA AI</div>

        <button class="new-chat" onclick="startNewChat()">
          ＋ New Chat
        </button>

        <div class="history-title">Recent Chats</div>

        <div id="chatList"></div>

        <div class="profile">

          <div id="avatar" class="avatar">E</div>

          <div class="profile-info">
            <div id="profileName" class="profile-name">User</div>
            <div id="profileEmail" class="profile-email"></div>
          </div>

          <button class="logout" onclick="logout()">
            Logout
          </button>

        </div>

      </aside>


      <!-- MAIN -->
      <main class="main">

        <header class="topbar">

          <button class="menu-btn" onclick="toggleSidebar()">
            ☰
          </button>

          <div id="topTitle" class="top-title">
            EMORA AI
          </div>

          <div class="status">
            <span class="dot"></span>
            Online
          </div>

        </header>


        <div id="chatArea">

          <div id="welcome" class="welcome">

            <div class="welcome-logo">✦</div>

            <h1>How can I help you?</h1>

            <p>
              Welcome to EMORA AI.<br>
              Ask anything and start a conversation.
            </p>

          </div>

        </div>


        <div id="typing" class="typing">
          EMORA is thinking
          <span>.</span><span>.</span><span>.</span>
        </div>


        <div class="composer-wrap">

          <div class="composer">

            <textarea
              id="messageInput"
              placeholder="Message EMORA..."
              rows="1"
              onkeydown="handleKey(event)"
            ></textarea>

            <button id="sendBtn" onclick="sendMessage()">
              ➤
            </button>

          </div>

          <div class="small-note">
            EMORA AI can make mistakes. Check important information.
          </div>

        </div>

      </main>

    </div>

  </section>


<script>

  /* =========================
     CONFIG
  ========================= */

  const API_BASE = window.location.origin;

  let token = localStorage.getItem("my_ai_token") || "";
  let currentUser = null;
  let currentChatId = null;
  let registerMode = false;


  /* =========================
     API
  ========================= */

  async function api(path, options = {}) {

    const headers = {
      "Content-Type": "application/json",
      ...(options.headers || {})
    };

    if (token) {
      headers.Authorization = "Bearer " + token;
    }

    const response = await fetch(API_BASE + path, {
      ...options,
      headers
    });

    let data = {};

    try {
      data = await response.json();
    } catch {
      data = {};
    }

    if (!response.ok) {
      throw new Error(data.error || "Request failed");
    }

    return data;
  }


  /* =========================
     AUTH MODE
  ========================= */

  function toggleAuth() {

    registerMode = !registerMode;

    document.getElementById("registerFields").style.display =
      registerMode ? "block" : "none";

    document.getElementById("authBtn").textContent =
      registerMode ? "Create account" : "Login";

    document.getElementById("switchText").textContent =
      registerMode
        ? "Already have an account?"
        : "Don't have an account?";

    document.getElementById("switchBtn").textContent =
      registerMode
        ? " Login"
        : " Create account";

    document.getElementById("authMessage").textContent = "";
  }


  /* =========================
     AUTH
  ========================= */

  async function handleAuth() {

    const email =
      document.getElementById("emailInput").value.trim();

    const password =
      document.getElementById("passwordInput").value;

    const name =
      document.getElementById("nameInput").value.trim();

    const message =
      document.getElementById("authMessage");

    message.textContent = "";

    if (!email || !password) {
      message.textContent = "Email and password are required.";
      return;
    }

    if (registerMode && !name) {
      message.textContent = "Please enter your name.";
      return;
    }

    const btn = document.getElementById("authBtn");

    btn.disabled = true;
    btn.textContent = registerMode ? "Creating..." : "Logging in...";

    try {

      const data = await api(
        registerMode ? "/register" : "/login",
        {
          method: "POST",
          body: JSON.stringify(
            registerMode
              ? { name, email, password }
              : { email, password }
          )
        }
      );

      token = data.token;

      localStorage.setItem("my_ai_token", token);

      await loadCurrentUser();

      showApp();

    } catch (error) {

      message.textContent = error.message;

    } finally {

      btn.disabled = false;
      btn.textContent =
        registerMode ? "Create account" : "Login";
    }
  }


  async function loadCurrentUser() {

    const data = await api("/me");

    currentUser = data.user || data;

    document.getElementById("profileName").textContent =
      currentUser.name || "User";

    document.getElementById("profileEmail").textContent =
      currentUser.email || "";

    document.getElementById("avatar").textContent =
      (currentUser.name || "U").charAt(0).toUpperCase();
  }


  function showApp() {

    document.getElementById("loginPage").style.display = "none";
    document.getElementById("app").style.display = "block";

    loadChats();
    startNewChat();
  }


  function logout() {

    api("/logout", {
      method: "POST"
    }).catch(() => {});

    token = "";
    currentUser = null;
    currentChatId = null;

    localStorage.removeItem("my_ai_token");

    document.getElementById("app").style.display = "none";
    document.getElementById("loginPage").style.display = "flex";

    document.getElementById("emailInput").value = "";
    document.getElementById("passwordInput").value = "";
  }


  /* =========================
     CHAT LIST
  ========================= */

  async function loadChats() {

    if (!token) return;

    const list = document.getElementById("chatList");

    try {

      const data = await api("/chats");

      const chats = data.chats || [];

      list.innerHTML = "";

      if (!chats.length) {

        list.innerHTML = `
          <div style="
            color:#666674;
            font-size:12px;
            padding:10px;
          ">
            No chats yet
          </div>
        `;

        return;
      }

      chats.forEach(chat => {

        const item = document.createElement("div");

        item.className =
          "chat-item" +
          (Number(chat.id) === Number(currentChatId)
            ? " active"
            : "");

        const title = document.createElement("div");

        title.className = "chat-title";

        title.textContent =
          chat.title || "New Chat";

        title.onclick = () => openChat(chat.id);

        const del = document.createElement("button");

        del.className = "delete-chat";
        del.textContent = "×";

        del.onclick = event => {
          event.stopPropagation();
          deleteChat(chat.id);
        };

        item.appendChild(title);
        item.appendChild(del);

        list.appendChild(item);
      });

    } catch (error) {

      console.error(error);

    }
  }


  /* =========================
     NEW CHAT
  ========================= */

  function startNewChat() {

    currentChatId = null;

    document.getElementById("topTitle").textContent =
      "EMORA AI";

    const area = document.getElementById("chatArea");

    area.innerHTML = `
      <div id="welcome" class="welcome">

        <div class="welcome-logo">✦</div>

        <h1>How can I help you?</h1>

        <p>
          Welcome to EMORA AI.<br>
          Ask anything and start a conversation.
        </p>

      </div>
    `;

    document.getElementById("messageInput").focus();

    loadChats();

    closeSidebar();
  }


  /* =========================
     OPEN CHAT
  ========================= */

  async function openChat(id) {

    try {

      const data = await api("/chats/" + id);

      currentChatId = data.chat.id;

      document.getElementById("topTitle").textContent =
        data.chat.title || "EMORA AI";

      renderMessages(data.messages || []);

      loadChats();

      closeSidebar();

    } catch (error) {

      alert(error.message);

    }
  }


  /* =========================
     RENDER MESSAGES
  ========================= */

  function renderMessages(messages) {

    const area = document.getElementById("chatArea");

    area.innerHTML = "";

    const container = document.createElement("div");

    container.className = "messages";

    messages.forEach(message => {

      addMessage(
        message.role === "user"
          ? "user"
          : "assistant",
        message.content,
        container
      );

    });

    area.appendChild(container);

    scrollBottom();
  }


  function addMessage(role, content, container = null) {

    const area = document.getElementById("chatArea");

    if (!container) {

      let messages =
        area.querySelector(".messages");

      if (!messages) {

        messages = document.createElement("div");

        messages.className = "messages";

        area.innerHTML = "";

        area.appendChild(messages);
      }

      container = messages;
    }

    const welcome =
      document.getElementById("welcome");

    if (welcome) {
      welcome.remove();
    }

    const row =
      document.createElement("div");

    row.className =
      "message " + role;

    const avatar =
      document.createElement("div");

    avatar.className =
      "message-avatar";

    avatar.textContent =
      role === "user" ? "You" : "✦";

    const bubble =
      document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = content;

    row.appendChild(avatar);
    row.appendChild(bubble);

    container.appendChild(row);

    scrollBottom();
  }


  /* =========================
     SEND MESSAGE
  ========================= */

  async function sendMessage() {

    const input =
      document.getElementById("messageInput");

    const text =
      input.value.trim();

    if (!text) return;

    const sendBtn =
      document.getElementById("sendBtn");

    input.value = "";

    addMessage("user", text);

    sendBtn.disabled = true;

    showTyping(true);

    try {

      const data = await api("/chat", {
        method: "POST",
        body: JSON.stringify({
          chatId: currentChatId,
          message: text
        })
      });

      currentChatId =
        data.chatId ||
        data.chat?.id ||
        currentChatId;

      if (data.reply) {
        addMessage("assistant", data.reply);
      }

      if (data.chat?.title) {
        document.getElementById("topTitle").textContent =
          data.chat.title;
      }

      loadChats();

    } catch (error) {

      addMessage(
        "assistant",
        "Sorry, something went wrong: " +
        error.message
      );

    } finally {

      sendBtn.disabled = false;

      showTyping(false);

      input.focus();
    }
  }


  /* =========================
     DELETE CHAT
  ========================= */

  async function deleteChat(id) {

    const ok =
      confirm("Delete this chat?");

    if (!ok) return;

    try {

      await api("/chats/" + id, {
        method: "DELETE"
      });

      if (Number(currentChatId) === Number(id)) {
        startNewChat();
      }

      loadChats();

    } catch (error) {

      alert(error.message);

    }
  }


  /* =========================
     TYPING
  ========================= */

  function showTyping(show) {

    document.getElementById("typing").style.display =
      show ? "block" : "none";

    if (show) {
      scrollBottom();
    }
  }


  /* =========================
     KEYBOARD
  ========================= */

  function handleKey(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();
    }
  }


  /* =========================
     SCROLL
  ========================= */

  function scrollBottom() {

    const area =
      document.getElementById("chatArea");

    setTimeout(() => {

      area.scrollTop =
        area.scrollHeight;

    }, 50);
  }


  /* =========================
     MOBILE SIDEBAR
  ========================= */

  function toggleSidebar() {

    document
      .getElementById("sidebar")
      .classList.toggle("open");
  }


  function closeSidebar() {

    document
      .getElementById("sidebar")
      .classList.remove("open");
  }


  /* =========================
     AUTO LOGIN
  ========================= */

  async function init() {

    if (!token) return;

    try {

      await loadCurrentUser();

      showApp();

    } catch (error) {

      token = "";

      localStorage.removeItem("my_ai_token");

    }
  }


  /* =========================
     START
  ========================= */

  init();

</script>

</body>
</html>
