<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >
  <title>EMORA AI</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #09090c;
      color: #fff;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans Bengali",
        "Noto Sans",
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       AUTH
    ========================== */

    #authScreen {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }

    .auth-box {
      width: 100%;
      max-width: 430px;
      background: #111116;
      border: 1px solid #25252d;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #92929b;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .auth-box input {
      width: 100%;
      height: 50px;
      margin-bottom: 12px;
      padding: 0 15px;
      border-radius: 13px;
      border: 1px solid #292930;
      outline: none;
      background: #18181e;
      color: #fff;
    }

    .auth-box input:focus {
      border-color: #666;
    }

    .primary-btn {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 13px;
      background: #fff;
      color: #000;
      font-weight: 800;
      margin-top: 5px;
    }

    .switch-auth {
      text-align: center;
      margin-top: 18px;
      color: #999;
      font-size: 14px;
    }

    .switch-auth span {
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-error {
      min-height: 20px;
      color: #ff6b6b;
      font-size: 13px;
      margin-bottom: 5px;
      text-align: center;
    }

    /* =========================
       APP
    ========================== */

    #app {
      width: 100%;
      height: 100%;
      display: none;
      min-height: 0;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    /* =========================
       SIDEBAR
    ========================== */

    .sidebar {
      width: 270px;
      height: 100%;
      flex-shrink: 0;
      background: #0e0e12;
      border-right: 1px solid #24242b;
      display: flex;
      flex-direction: column;
      min-height: 0;
      z-index: 20;
    }

    .side-top {
      padding: 18px;
      border-bottom: 1px solid #222229;
    }

    .brand {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .new-chat-btn {
      width: 100%;
      height: 45px;
      border: 1px solid #2c2c34;
      border-radius: 12px;
      background: #17171d;
      color: #fff;
      font-weight: 700;
    }

    .new-chat-btn:active {
      transform: scale(.98);
    }

    .chat-list-title {
      padding: 16px 18px 8px;
      color: #777780;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .chat-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 5px 10px 10px;
      -webkit-overflow-scrolling: touch;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 10px;
      margin-bottom: 4px;
      border-radius: 10px;
      color: #c7c7ce;
      font-size: 14px;
      cursor: pointer;
    }

    .chat-item:hover,
    .chat-item.active {
      background: #19191f;
      color: #fff;
    }

    .chat-title {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .delete-chat {
      border: 0;
      background: transparent;
      color: #777;
      padding: 4px;
      font-size: 14px;
    }

    .delete-chat:hover {
      color: #ff5555;
    }

    .side-bottom {
      border-top: 1px solid #222229;
      padding: 14px;
    }

    .profile-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: #ccc;
      padding: 10px;
      text-align: left;
      border-radius: 10px;
    }

    .profile-btn:hover {
      background: #18181e;
    }

    /* =========================
       MAIN
    ========================== */

    .main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .topbar {
      height: 62px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid #222229;
      background: #0b0b0f;
      z-index: 5;
    }

    .mobile-menu {
      display: none;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 23px;
    }

    .current-title {
      flex: 1;
      min-width: 0;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .voice-status {
      color: #777780;
      font-size: 12px;
    }

    /* =========================
       MESSAGES / SCROLL
    ========================== */

    .messages {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 25px 18px 35px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
    }

    .messages-inner {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .welcome {
      min-height: 55vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      color: #888;
      padding: 30px;
    }

    .welcome-logo {
      font-size: 45px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #fff;
      margin-bottom: 12px;
    }

    .welcome p {
      margin: 0;
      max-width: 500px;
      line-height: 1.6;
    }

    .message {
      width: 100%;
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .message.user {
      align-items: flex-end;
    }

    .message.assistant {
      align-items: flex-start;
    }

    .message-label {
      font-size: 11px;
      color: #666670;
      margin-bottom: 6px;
      padding: 0 4px;
    }

    .message.user .message-label {
      text-align: right;
    }

    .message.assistant .message-label {
      text-align: left;
    }

    .bubble {
      max-width: min(78%, 720px);
      padding: 12px 15px;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .message.user .bubble {
      background: #25252d;
      color: #fff;
      border-radius: 18px 18px 5px 18px;
    }

    .message.assistant .bubble {
      background: #15151a;
      color: #fff;
      border: 1px solid #292930;
      border-radius: 18px 18px 18px 5px;
    }

    .message-image {
      display: block;
      max-width: 280px;
      max-height: 330px;
      object-fit: contain;
      border-radius: 14px;
      margin-bottom: 8px;
      border: 1px solid #303038;
    }

    /* =========================
       THINKING
    ========================== */

    .ai-thinking {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      margin-bottom: 18px;
    }

    .thinking-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      border: 1px solid #292930;
      background: #15151a;
      border-radius: 16px;
      color: #aaa;
      font-size: 13px;
    }

    .dots {
      display: flex;
      gap: 4px;
    }

    .dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #aaa;
      animation: blink 1.2s infinite;
    }

    .dots span:nth-child(2) {
      animation-delay: .2s;
    }

    .dots span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {
      0%, 80%, 100% {
        opacity: .2;
        transform: translateY(0);
      }

      40% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* =========================
       IMAGE PREVIEW
    ========================== */

    .image-preview {
      display: none;
      padding: 8px 15px 0;
      max-width: 900px;
      width: 100%;
      margin: auto;
    }

    .preview-box {
      position: relative;
      display: inline-block;
    }

    .preview-box img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #333;
    }

    .remove-image {
      position: absolute;
      top: -7px;
      right: -7px;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      border: 0;
      background: #ff4b4b;
      color: #fff;
      font-weight: 900;
    }

    /* =========================
       INPUT
    ========================== */

    .input-area {
      flex-shrink: 0;
      width: 100%;
      padding:
        10px 15px
        calc(12px + env(safe-area-inset-bottom));
      background: #0b0b0f;
      border-top: 1px solid #222229;
    }

    .input-wrap {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .tool-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tool-row::-webkit-scrollbar {
      display: none;
    }

    .tool-btn {
      flex-shrink: 0;
      height: 35px;
      padding: 0 11px;
      border: 1px solid #292930;
      background: #15151a;
      color: #ccc;
      border-radius: 10px;
      font-size: 12px;
    }

    .tool-btn.active {
      background: #25252d;
      color: #fff;
      border-color: #555;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #15151a;
      border: 1px solid #2b2b33;
      border-radius: 17px;
      padding: 8px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      max-height: 130px;
      min-height: 42px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      padding: 10px 8px;
      line-height: 1.5;
    }

    #messageInput::placeholder {
      color: #666670;
    }

    .send-btn,
    .mic-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 12px;
      border: 0;
      background: #fff;
      color: #000;
      font-size: 18px;
    }

    .mic-btn {
      background: #25252d;
      color: #fff;
    }

    .mic-btn.listening {
      background: #ff4444;
      color: #fff;
      animation: micPulse 1s infinite;
    }

    @keyframes micPulse {
      50% {
        transform: scale(1.06);
      }
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 760px) {

      .sidebar {
        position: fixed;
        left: -290px;
        top: 0;
        bottom: 0;
        width: 280px;
        transition: left .25s ease;
        box-shadow: 20px 0 50px rgba(0,0,0,.45);
      }

      .sidebar.open {
        left: 0;
      }

      .mobile-menu {
        display: block;
      }

      .voice-status {
        display: none;
      }

      .topbar {
        padding: 0 12px;
      }

      .messages {
        padding: 18px 10px 25px;
      }

      .bubble {
        max-width: 86%;
        font-size: 14px;
      }

      .input-area {
        padding-left: 9px;
        padding-right: 9px;
      }

      .composer {
        border-radius: 15px;
      }

      .welcome-logo {
        font-size: 36px;
      }
    }

    /* Overlay */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 15;
    }

    #overlay.show {
      display: block;
    }

    /* =========================
       MODAL
    ========================== */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 390px;
      background: #131318;
      border: 1px solid #2a2a32;
      border-radius: 20px;
      padding: 22px;
    }

    .modal-box h3 {
      margin-top: 0;
    }

    .modal-box p {
      color: #999;
      font-size: 14px;
      line-height: 1.6;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .modal-actions button {
      flex: 1;
      height: 43px;
      border-radius: 11px;
      border: 1px solid #303039;
      background: #1a1a20;
      color: #fff;
    }
  </style>
</head>

<body>

  <!-- =========================
       AUTH SCREEN
  ========================== -->

  <section id="authScreen">

    <div class="auth-box">

      <div class="logo">EMORA</div>

      <div class="subtitle">
        Your personal AI assistant
      </div>

      <div id="authError" class="auth-error"></div>

      <div id="loginForm">

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button class="primary-btn" onclick="login()">
          Login
        </button>

        <div class="switch-auth">
          Don't have an account?
          <span onclick="showRegister()">Register</span>
        </div>

      </div>

      <div id="registerForm" style="display:none">

        <input
          id="registerName"
          type="text"
          placeholder="Your name"
          autocomplete="name"
        >

        <input
          id="registerEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          id="registerPassword"
          type="password"
          placeholder="Password"
          autocomplete="new-password"
        >

        <button class="primary-btn" onclick="registerUser()">
          Create Account
        </button>

        <div class="switch-auth">
          Already have an account?
          <span onclick="showLogin()">Login</span>
        </div>

      </div>

    </div>

  </section>


  <!-- =========================
       APP
  ========================== -->

  <section id="app">

    <div class="app">

      <aside id="sidebar" class="sidebar">

        <div class="side-top">

          <div class="brand">
            EMORA AI
          </div>

          <button
            class="new-chat-btn"
            onclick="newChat()"
          >
            ＋ New Chat
          </button>

        </div>

        <div class="chat-list-title">
          Recent Chats
        </div>

        <div id="chatList" class="chat-list"></div>

        <div class="side-bottom">

          <button
            class="profile-btn"
            onclick="showProfile()"
          >
            👤 <span id="profileName">Profile</span>
          </button>

        </div>

      </aside>


      <div
        id="overlay"
        onclick="closeSidebar()"
      ></div>


      <main class="main">

        <header class="topbar">

          <button
            class="mobile-menu"
            onclick="toggleSidebar()"
          >
            ☰
          </button>

          <div
            id="currentTitle"
            class="current-title"
          >
            New Chat
          </div>

          <div
            id="voiceStatus"
            class="voice-status"
          >
            🔊 Female Voice
          </div>

        </header>


        <!-- MESSAGE AREA -->

        <section
          id="messages"
          class="messages"
        >

          <div
            id="messagesInner"
            class="messages-inner"
          >

            <div
              id="welcome"
              class="welcome"
            >

              <div class="welcome-logo">
                EMORA
              </div>

              <p>
                তোমার ব্যক্তিগত AI assistant।
                আমাকে যেকোনো প্রশ্ন করতে পারো।
              </p>

            </div>

          </div>

        </section>


        <!-- IMAGE PREVIEW -->

        <div
          id="imagePreview"
          class="image-preview"
        >
          <div class="preview-box">

            <img
              id="previewImage"
              alt="Selected image"
            >

            <button
              class="remove-image"
              onclick="removeSelectedImage()"
            >
              ×
            </button>

          </div>
        </div>


        <!-- INPUT -->

        <section class="input-area">

          <div class="input-wrap">

            <div class="tool-row">

              <button
                class="tool-btn"
                onclick="selectImage()"
              >
                🖼️ Image
              </button>

              <button
                class="tool-btn"
                onclick="generateImage()"
              >
                🎨 Create Image
              </button>

              <button
                id="autoVoiceBtn"
                class="tool-btn active"
                onclick="toggleAutoVoice()"
              >
                🔊 Auto Voice ON
              </button>

              <button
                class="tool-btn"
                onclick="stopSpeaking()"
              >
                ⏹ Stop Voice
              </button>

            </div>

            <div class="composer">

              <textarea
                id="messageInput"
                placeholder="বাংলায় লিখুন..."
                rows="1"
                oninput="autoResize(this)"
              ></textarea>

              <button
                id="micBtn"
                class="mic-btn"
                onclick="toggleMic()"
                title="Voice input"
              >
                🎤
              </button>

              <button
                id="sendBtn"
                class="send-btn"
                onclick="sendMessage()"
              >
                ➤
              </button>

            </div>

          </div>

        </section>

      </main>

    </div>

  </section>


  <!-- FILE INPUT -->

  <input
    id="imageInput"
    type="file"
    accept="image/*"
    style="display:none"
    onchange="handleImageSelect(event)"
  >


  <!-- PROFILE MODAL -->

  <div
    id="profileModal"
    class="modal"
    onclick="closeModal(event)"
  >

    <div
      class="modal-box"
      onclick="event.stopPropagation()"
    >

      <h3>Profile</h3>

      <p id="profileInfo"></p>

      <div class="modal-actions">

        <button onclick="closeProfile()">
          Close
        </button>

        <button onclick="logout()">
          Logout
        </button>

      </div>

    </div>

  </div>


<script>

  /* =====================================================
     CONFIG
  ===================================================== */

  const API_BASE = "";

  let token = localStorage.getItem("emora_token") || "";

  let currentUser = null;
  let currentChatId = null;

  let selectedImageData = null;

  let autoVoice =
    localStorage.getItem("emora_auto_voice") !== "false";

  let recognition = null;
  let isListening = false;

  let availableVoices = [];


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const authScreen =
    document.getElementById("authScreen");

  const app =
    document.getElementById("app");

  const messages =
    document.getElementById("messages");

  const messagesInner =
    document.getElementById("messagesInner");

  const messageInput =
    document.getElementById("messageInput");

  const sendBtn =
    document.getElementById("sendBtn");

  const micBtn =
    document.getElementById("micBtn");

  const autoVoiceBtn =
    document.getElementById("autoVoiceBtn");

  const authError =
    document.getElementById("authError");

  const chatList =
    document.getElementById("chatList");


  /* =====================================================
     AUTH UI
  ===================================================== */

  function showLogin() {

    document.getElementById("loginForm").style.display = "block";

    document.getElementById("registerForm").style.display = "none";

    authError.textContent = "";

  }


  function showRegister() {

    document.getElementById("loginForm").style.display = "none";

    document.getElementById("registerForm").style.display = "block";

    authError.textContent = "";

  }


  /* =====================================================
     API
  ===================================================== */

  async function api(path, options = {}) {

    const headers = {
      ...(options.headers || {})
    };

    if (options.body && !headers["Content-Type"]) {
      headers["Content-Type"] = "application/json";
    }

    if (token) {
      headers["Authorization"] =
        "Bearer " + token;
    }

    const response = await fetch(
      API_BASE + path,
      {
        ...options,
        headers
      }
    );

    let data = {};

    try {
      data = await response.json();
    } catch (_) {}

    if (!response.ok) {

      throw new Error(
        data.error ||
        data.message ||
        "Request failed"
      );

    }

    return data;

  }


  /* =====================================================
     REGISTER
  ===================================================== */

  async function registerUser() {

    const name =
      document.getElementById("registerName").value.trim();

    const email =
      document.getElementById("registerEmail").value.trim();

    const password =
      document.getElementById("registerPassword").value;

    authError.textContent = "";

    if (!name || !email || !password) {

      authError.textContent =
        "সব তথ্য পূরণ করুন।";

      return;

    }

    try {

      const data = await api(
        "/register",
        {
          method: "POST",
          body: JSON.stringify({
            name,
            email,
            password
          })
        }
      );

      if (data.token) {

        token = data.token;

        localStorage.setItem(
          "emora_token",
          token
        );

      }

      await startApp();

    } catch (error) {

      authError.textContent =
        error.message;

    }

  }


  /* =====================================================
     LOGIN
  ===================================================== */

  async function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    authError.textContent = "";

    if (!email || !password) {

      authError.textContent =
        "Email এবং password দিন।";

      return;

    }

    try {

      const data = await api(
        "/login",
        {
          method: "POST",
          body: JSON.stringify({
            email,
            password
          })
        }
      );

      token = data.token;

      localStorage.setItem(
        "emora_token",
        token
      );

      await startApp();

    } catch (error) {

      authError.textContent =
        error.message;

    }

  }


  /* =====================================================
     START APP
  ===================================================== */

  async function startApp() {

    try {

      const data =
        await api("/me");

      currentUser =
        data.user || data;

      authScreen.style.display = "none";

      app.style.display = "block";

      document.getElementById(
        "profileName"
      ).textContent =
        currentUser.name ||
        "Profile";

      updateAutoVoiceButton();

      setupSpeechRecognition();

      loadVoices();

      await loadChats();

    } catch (error) {

      token = "";

      localStorage.removeItem(
        "emora_token"
      );

      authScreen.style.display = "flex";

      app.style.display = "none";

    }

  }


  /* =====================================================
     LOGOUT
  ===================================================== */

  async function logout() {

    try {

      await api(
        "/logout",
        {
          method: "POST"
        }
      );

    } catch (_) {}

    token = "";

    currentUser = null;

    currentChatId = null;

    localStorage.removeItem(
      "emora_token"
    );

    location.reload();

  }


  /* =====================================================
     CHATS
  ===================================================== */

  async function loadChats() {

    try {

      const data =
        await api("/chats");

      chatList.innerHTML = "";

      const chats =
        Array.isArray(data)
          ? data
          : data.chats || [];

      chats.forEach(chat => {

        const item =
          document.createElement("div");

        item.className =
          "chat-item" +
          (
            String(chat.id) ===
            String(currentChatId)
              ? " active"
              : ""
          );

        const title =
          document.createElement("div");

        title.className =
          "chat-title";

        title.textContent =
          chat.title ||
          "New Chat";

        title.onclick = () =>
          openChat(chat.id);

        const del =
          document.createElement("button");

        del.className =
          "delete-chat";

        del.textContent =
          "🗑";

        del.onclick = async event => {

          event.stopPropagation();

          await deleteChat(chat.id);

        };

        item.appendChild(title);

        item.appendChild(del);

        chatList.appendChild(item);

      });

    } catch (error) {

      console.error(
        "Load chats:",
        error
      );

    }

  }


  async function openChat(chatId) {

    try {

      const data =
        await api(
          "/chats/" + chatId
        );

      currentChatId =
        chatId;

      messagesInner.innerHTML = "";

      const chat =
        data.chat || data;

      document.getElementById(
        "currentTitle"
      ).textContent =
        chat.title ||
        "Chat";

      const chatMessages =
        data.messages ||
        [];

      chatMessages.forEach(msg => {

        addMessage(
          msg.role,
          msg.content
        );

      });

      await loadChats();

      scrollToBottom();

      closeSidebar();

    } catch (error) {

      console.error(
        error
      );

    }

  }


  async function deleteChat(chatId) {

    if (
      !confirm(
        "এই chat delete করতে চান?"
      )
    ) {
      return;
    }

    try {

      await api(
        "/chats/" + chatId,
        {
          method: "DELETE"
        }
      );

      if (
        String(currentChatId) ===
        String(chatId)
      ) {
        newChat();
      }

      await loadChats();

    } catch (error) {

      alert(
        error.message
      );

    }

  }


  function newChat() {

    currentChatId = null;

    messagesInner.innerHTML = `
      <div id="welcome" class="welcome">
        <div class="welcome-logo">EMORA</div>
        <p>
          তোমার ব্যক্তিগত AI assistant।
          আমাকে যেকোনো প্রশ্ন করতে পারো।
        </p>
      </div>
    `;

    document.getElementById(
      "currentTitle"
    ).textContent =
      "New Chat";

    removeSelectedImage();

    scrollToBottom();

    closeSidebar();

  }


  /* =====================================================
     MESSAGE
  ===================================================== */

  function addMessage(
    role,
    content,
    imageSrc = null
  ) {

    const welcome =
      document.getElementById(
        "welcome"
      );

    if (welcome) {
      welcome.remove();
    }

    const message =
      document.createElement("div");

    message.className =
      "message " +
      (
        role === "user"
          ? "user"
          : "assistant"
      );

    const label =
      document.createElement("div");

    label.className =
      "message-label";

    label.textContent =
      role === "user"
        ? "You"
        : "EMORA";

    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    if (imageSrc) {

      const img =
        document.createElement("img");

      img.className =
        "message-image";

      img.src =
        imageSrc;

      img.alt =
        "Selected image";

      bubble.appendChild(img);

    }

    if (content) {

      const text =
        document.createElement("div");

      text.textContent =
        content;

      bubble.appendChild(text);

    }

    message.appendChild(label);

    message.appendChild(bubble);

    messagesInner.appendChild(
      message
    );

    scrollToBottom();

  }


  /* =====================================================
     THINKING
  ===================================================== */

  function showThinking() {

    hideThinking();

    const box =
      document.createElement("div");

    box.id =
      "thinking";

    box.className =
      "ai-thinking";

    box.innerHTML = `
      <div class="thinking-box">
        <span>EMORA is thinking</span>
        <span class="dots">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </div>
    `;

    messagesInner.appendChild(
      box
    );

    scrollToBottom();

  }


  function hideThinking() {

    const thinking =
      document.getElementById(
        "thinking"
      );

    if (thinking) {
      thinking.remove();
    }

  }


  /* =====================================================
     SEND MESSAGE
  ===================================================== */

  async function sendMessage() {

    const text =
      messageInput.value.trim();

    if (!text && !selectedImageData) {
      return;
    }

    if (!token) {
      return;
    }

    const imageToSend =
      selectedImageData;

    const visibleText =
      text ||
      "এই ছবিটি দেখো।";

    addMessage(
      "user",
      text,
      imageToSend
    );

    messageInput.value = "";

    autoResize(
      messageInput
    );

    removeSelectedImage();

    sendBtn.disabled = true;

    showThinking();

    try {

      let data;

      /*
        যদি image থাকে, /analyze-image route ব্যবহার হবে।
        তোমার server.js-এ এই route থাকতে হবে।
      */

      if (imageToSend) {

        data = await api(
          "/analyze-image",
          {
            method: "POST",
            body: JSON.stringify({
              message: text,
              image: imageToSend,
              chatId: currentChatId
            })
          }
        );

      } else {

        data = await api(
          "/chat",
          {
            method: "POST",
            body: JSON.stringify({
              message: visibleText,
              chatId: currentChatId
            })
          }
        );

      }

      hideThinking();

      if (data.chatId) {

        currentChatId =
          data.chatId;

      }

      if (data.chat) {

        document.getElementById(
          "currentTitle"
        ).textContent =
          data.chat.title ||
          "Chat";

      }

      const reply =
        data.reply ||
        data.message?.content ||
        "কোনো উত্তর পাওয়া যায়নি।";

      addMessage(
        "assistant",
        reply
      );

      /*
        AI উত্তর আসার পর automatically
        female voice-এ পড়বে।
      */

      if (autoVoice) {

        setTimeout(
          () => speakText(reply),
          100
        );

      }

      await loadChats();

    } catch (error) {

      hideThinking();

      addMessage(
        "assistant",
        "দুঃখিত, এই মুহূর্তে উত্তর দিতে সমস্যা হচ্ছে।\n\n" +
        error.message
      );

    } finally {

      sendBtn.disabled = false;

      messageInput.focus();

    }

  }


  /* =====================================================
     IMAGE SELECT
  ===================================================== */

  function selectImage() {

    document
      .getElementById("imageInput")
      .click();

  }


  async function handleImageSelect(event) {

    const file =
      event.target.files?.[0];

    if (!file) {
      return;
    }

    if (!file.type.startsWith("image/")) {

      alert(
        "শুধু image file নির্বাচন করুন।"
      );

      return;

    }

    try {

      selectedImageData =
        await compressImage(file);

      document.getElementById(
        "previewImage"
      ).src =
        selectedImageData;

      document.getElementById(
        "imagePreview"
      ).style.display =
        "block";

    } catch (error) {

      alert(
        "Image প্রস্তুত করা যায়নি।"
      );

    }

    event.target.value = "";

  }


  function compressImage(file) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();

        reader.onload = event => {

          const img =
            new Image();

          img.onload = () => {

            const maxSize =
              1600;

            let width =
              img.width;

            let height =
              img.height;

            if (
              width > maxSize ||
              height > maxSize
            ) {

              if (width > height) {

                height =
                  Math.round(
                    height *
                    maxSize /
                    width
                  );

                width =
                  maxSize;

              } else {

                width =
                  Math.round(
                    width *
                    maxSize /
                    height
                  );

                height =
                  maxSize;

              }

            }

            const canvas =
              document.createElement(
                "canvas"
              );

            canvas.width =
              width;

            canvas.height =
              height;

            const ctx =
              canvas.getContext(
                "2d"
              );

            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );

            resolve(
              canvas.toDataURL(
                "image/jpeg",
                0.82
              )
            );

          };

          img.onerror =
            reject;

          img.src =
            event.target.result;

        };

        reader.onerror =
          reject;

        reader.readAsDataURL(
          file
        );

      }
    );

  }


  function removeSelectedImage() {

    selectedImageData =
      null;

    document.getElementById(
      "imagePreview"
    ).style.display =
      "none";

    document.getElementById(
      "previewImage"
    ).src = "";

  }


  /* =====================================================
     AI IMAGE GENERATION
  ===================================================== */

  async function generateImage() {

    const prompt =
      messageInput.value.trim();

    if (!prompt) {

      alert(
        "আগে ছবির জন্য কী বানাতে চাও সেটা লিখো।"
      );

      messageInput.focus();

      return;

    }

    showThinking();

    try {

      const data =
        await api(
          "/generate-image",
          {
            method: "POST",
            body: JSON.stringify({
              prompt
            })
          }
        );

      hideThinking();

      const image =
        data.image;

      if (!image) {

        throw new Error(
          "Image পাওয়া যায়নি।"
        );

      }

      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message assistant";

      const label =
        document.createElement(
          "div"
        );

      label.className =
        "message-label";

      label.textContent =
        "EMORA";

      const bubble =
        document.createElement(
          "div"
        );

      bubble.className =
        "bubble";

      const img =
        document.createElement(
          "img"
        );

      img.className =
        "message-image";

      if (
        image.type === "base64"
      ) {

        img.src =
          "data:image/png;base64," +
          image.data;

      } else {

        img.src =
          image.url;

      }

      img.alt =
        "AI Generated Image";

      bubble.appendChild(
        img
      );

      message.appendChild(
        label
      );

      message.appendChild(
        bubble
      );

      messagesInner.appendChild(
        message
      );

      scrollToBottom();

      messageInput.value = "";

      autoResize(
        messageInput
      );

    } catch (error) {

      hideThinking();

      addMessage(
        "assistant",
        "ছবি তৈরি করা যায়নি।\n\n" +
        error.message
      );

    }

  }


  /* =====================================================
     TEXT TO SPEECH
     FEMALE + BANGLA PRIORITY
  ===================================================== */

  function loadVoices() {

    if (!("speechSynthesis" in window)) {
      return;
    }

    availableVoices =
      speechSynthesis.getVoices();

  }


  if (
    "speechSynthesis" in window
  ) {

    speechSynthesis.onvoiceschanged =
      loadVoices;

  }


  function isBengali(text) {

    return /[\u0980-\u09FF]/.test(
      text
    );

  }


  function findFemaleVoice(text) {

    if (!availableVoices.length) {
      availableVoices =
        speechSynthesis.getVoices();
    }

    const bengaliVoices =
      availableVoices.filter(
        voice =>
          /bn|bangla|bengali/i.test(
            voice.lang +
            " " +
            voice.name
          )
      );

    /*
      Female-name hints.
      Browser voice metadata সবসময় gender দেয় না,
      তাই নাম দেখে female priority করা হচ্ছে।
    */

    const femaleHints =
      /female|woman|girl|zira|samantha|google.*female|microsoft.*female|heera|priya|raveena|veena/i;

    const femaleBengali =
      bengaliVoices.find(
        voice =>
          femaleHints.test(
            voice.name
          )
      );

    if (femaleBengali) {
      return femaleBengali;
    }

    if (bengaliVoices.length) {
      return bengaliVoices[0];
    }

    /*
      Bengali voice না থাকলে female-looking
      voice-এর fallback।
    */

    const femaleAny =
      availableVoices.find(
        voice =>
          femaleHints.test(
            voice.name
          )
      );

    if (femaleAny) {
      return femaleAny;
    }

    return (
      availableVoices.find(
        voice =>
          /^en/i.test(
            voice.lang
          )
      ) ||
      availableVoices[0] ||
      null
    );

  }


  function speakText(text) {

    if (
      !text ||
      !("speechSynthesis" in window)
    ) {
      return;
    }

    speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(
        text
      );

    const voice =
      findFemaleVoice(text);

    if (voice) {

      utterance.voice =
        voice;

      /*
        Bengali voice পাওয়া গেলে
        Bengali language ব্যবহার।
      */

      if (
        isBengali(text) &&
        /bn|bangla|bengali/i.test(
          voice.lang +
          " " +
          voice.name
        )
      ) {

        utterance.lang =
          voice.lang;

      } else {

        utterance.lang =
          voice.lang;

      }

    } else {

      utterance.lang =
        isBengali(text)
          ? "bn-BD"
          : "en-US";

    }

    /*
      Female voice-এর জন্য
      natural pitch/speed।
    */

    utterance.rate =
      0.92;

    utterance.pitch =
      1.08;

    utterance.volume =
      1;

    speechSynthesis.speak(
      utterance
    );

  }


  function stopSpeaking() {

    if (
      "speechSynthesis" in window
    ) {

      speechSynthesis.cancel();

    }

  }


  /* =====================================================
     AUTO VOICE
  ===================================================== */

  function toggleAutoVoice() {

    autoVoice =
      !autoVoice;

    localStorage.setItem(
      "emora_auto_voice",
      String(autoVoice)
    );

    updateAutoVoiceButton();

  }


  function updateAutoVoiceButton() {

    if (!autoVoiceBtn) {
      return;
    }

    autoVoiceBtn.textContent =
      autoVoice
        ? "🔊 Auto Voice ON"
        : "🔇 Auto Voice OFF";

    autoVoiceBtn.classList.toggle(
      "active",
      autoVoice
    );

  }


  /* =====================================================
     MICROPHONE / SPEECH RECOGNITION
  ===================================================== */

  function setupSpeechRecognition() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

      micBtn.title =
        "এই browser voice input support করে না";

      return;

    }

    recognition =
      new SpeechRecognition();

    recognition.continuous =
      false;

    recognition.interimResults =
      true;

    recognition.lang =
      "bn-BD";


    recognition.onstart =
      () => {

        isListening =
          true;

        micBtn.classList.add(
          "listening"
        );

        micBtn.textContent =
          "⏹";

      };


    recognition.onresult =
      event => {

        let transcript =
          "";

        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          transcript +=
            event.results[i][0].transcript;

        }

        messageInput.value =
          transcript;

        autoResize(
          messageInput
        );

      };


    recognition.onerror =
      event => {

        console.error(
          "Speech recognition:",
          event.error
        );

        isListening =
          false;

        micBtn.classList.remove(
          "listening"
        );

        micBtn.textContent =
          "🎤";

      };


    recognition.onend =
      () => {

        isListening =
          false;

        micBtn.classList.remove(
          "listening"
        );

        micBtn.textContent =
          "🎤";

      };

  }


  function toggleMic() {

    if (!recognition) {

      alert(
        "তোমার browser voice input support করছে না। Chrome ব্যবহার করে চেষ্টা করো।"
      );

      return;

    }

    if (isListening) {

      recognition.stop();

      return;

    }

    try {

      recognition.lang =
        "bn-BD";

      recognition.start();

    } catch (error) {

      console.error(
        error
      );

    }

  }


  /* =====================================================
     SCROLL
  ===================================================== */

  function scrollToBottom() {

    requestAnimationFrame(
      () => {

        messages.scrollTop =
          messages.scrollHeight;

      }
    );

  }


  /* =====================================================
     TEXTAREA
  ===================================================== */

  function autoResize(element) {

    element.style.height =
      "auto";

    element.style.height =
      Math.min(
        element.scrollHeight,
        130
      ) + "px";

  }


  /* =====================================================
     ENTER TO SEND
  ===================================================== */

  messageInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /* =====================================================
     SIDEBAR
  ===================================================== */

  function toggleSidebar() {

    document
      .getElementById("sidebar")
      .classList.toggle("open");

    document
      .getElementById("overlay")
      .classList.toggle("show");

  }


  function closeSidebar() {

    document
      .getElementById("sidebar")
      .classList.remove("open");

    document
      .getElementById("overlay")
      .classList.remove("show");

  }


  /* =====================================================
     PROFILE
  ===================================================== */

  function showProfile() {

    const modal =
      document.getElementById(
        "profileModal"
      );

    const info =
      document.getElementById(
        "profileInfo"
      );

    info.textContent =
      currentUser
        ? (
            "Name: " +
            (currentUser.name || "") +
            "\nEmail: " +
            (currentUser.email || "") +
            "\nPlan: " +
            (currentUser.plan || "free")
          )
        : "Profile";

    modal.classList.add(
      "show"
    );

  }


  function closeProfile() {

    document
      .getElementById(
        "profileModal"
      )
      .classList.remove(
        "show"
      );

  }


  function closeModal(event) {

    if (
      event.target.id ===
      "profileModal"
    ) {

      closeProfile();

    }

  }


  /* =====================================================
     AUTO LOGIN
  ===================================================== */

  window.addEventListener(
    "load",
    async () => {

      loadVoices();

      if (token) {

        await startApp();

      } else {

        showLogin();

      }

    }
  );

</script>
