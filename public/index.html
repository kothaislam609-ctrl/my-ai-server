<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>EMORA AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #08090d;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #20232b;
      background: #0d0f14;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand span {
      color: #7c5cff;
    }

    .user {
      font-size: 13px;
      color: #aaa;
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px 100px;
    }

    .welcome {
      text-align: center;
      margin-top: 20vh;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: auto;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#7c5cff,#4c8dff);
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 0 35px #654cff55;
    }

    .welcome h1 {
      margin-top: 18px;
      font-size: 27px;
    }

    .welcome p {
      margin-top: 8px;
      color: #9297a5;
      font-size: 14px;
    }

    .message {
      max-width: 88%;
      padding: 12px 14px;
      margin: 10px 0;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user-msg {
      margin-left: auto;
      background: #6751d9;
      border-bottom-right-radius: 5px;
    }

    .ai-msg {
      margin-right: auto;
      background: #171a21;
      border: 1px solid #252a34;
      border-bottom-left-radius: 5px;
    }

    .typing {
      color: #9297a5;
      font-size: 13px;
      margin: 12px;
    }

    .input-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 12px 14px;
      background: linear-gradient(transparent,#08090d 25%);
    }

    .input-box {
      max-width: 700px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #151820;
      border: 1px solid #292d37;
      border-radius: 18px;
      padding: 7px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 15px;
      padding: 9px;
      min-height: 42px;
      max-height: 120px;
      font-family: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    #send {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #7058e8;
      color: white;
      font-size: 18px;
    }

    #logout {
      display: none;
      background: transparent;
      color: #888;
      font-size: 12px;
      margin: 8px auto;
    }

    .login {
      position: fixed;
      inset: 0;
      background: #08090d;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: #11141a;
      border: 1px solid #272b35;
      border-radius: 24px;
      padding: 25px;
    }

    .login-card h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .login-card input {
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      border: 1px solid #292d37;
      border-radius: 12px;
      background: #191c24;
      color: white;
      outline: none;
    }

    .login-card button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 12px;
      background: #7058e8;
      color: white;
      font-weight: bold;
    }

    #loginError {
      color: #ff7777;
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="brand">EMORA <span>AI</span></div>
    <div class="user" id="userName"></div>
  </header>

  <main id="chat">

    <div class="welcome" id="welcome">
      <div class="logo">E</div>
      <h1>How can I help?</h1>
      <p>আমি EMORA AI — তোমার AI assistant.</p>
    </div>

  </main>

  <div class="input-area">
    <div class="input-box">
      <textarea
        id="message"
        placeholder="EMORA AI-কে কিছু জিজ্ঞেস করো..."
        rows="1"></textarea>

      <button id="send">➤</button>
    </div>
  </div>

</div>


<!-- LOGIN -->

<div class="login" id="loginScreen">

  <div class="login-card">

    <h2>EMORA AI</h2>

    <input
      id="email"
      type="email"
      placeholder="Email">

    <input
      id="password"
      type="password"
      placeholder="Password">

    <button id="loginBtn">
      Login
    </button>

    <div id="loginError"></div>

  </div>

</div>


<script>

const API_URL = window.location.origin;

const token =
  localStorage.getItem("my_ai_token");

const chat =
  document.getElementById("chat");

const message =
  document.getElementById("message");

const send =
  document.getElementById("send");

const loginScreen =
  document.getElementById("loginScreen");

const loginBtn =
  document.getElementById("loginBtn");

const loginError =
  document.getElementById("loginError");

const userName =
  document.getElementById("userName");

const welcome =
  document.getElementById("welcome");


// -------------------------
// CHECK LOGIN
// -------------------------

async function loadUser() {

  if (!token) {
    loginScreen.style.display = "flex";
    return;
  }

  try {

    const res = await fetch(
      API_URL + "/me",
      {
        headers: {
          Authorization: "Bearer " + token
        }
      }
    );

    const data = await res.json();

    if (!data.success) {
      localStorage.removeItem("my_ai_token");
      loginScreen.style.display = "flex";
      return;
    }

    loginScreen.style.display = "none";

    userName.textContent =
      data.user.name;

  } catch (error) {

    loginScreen.style.display = "flex";

  }
}


// -------------------------
// LOGIN
// -------------------------

loginBtn.onclick = async () => {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  loginError.textContent = "";

  if (!email || !password) {

    loginError.textContent =
      "Email এবং password দাও।";

    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  try {

    const res = await fetch(
      API_URL + "/login",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          email,
          password
        })
      }
    );

    const data = await res.json();

    if (!data.success) {

      loginError.textContent =
        data.error || "Login failed.";

      loginBtn.disabled = false;
      loginBtn.textContent = "Login";

      return;
    }

    localStorage.setItem(
      "my_ai_token",
      data.token
    );

    location.reload();

  } catch (error) {

    loginError.textContent =
      "Server-এর সাথে যোগাযোগ করা যাচ্ছে না।";

    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }

};


// -------------------------
// ADD MESSAGE
// -------------------------

function addMessage(text, type) {

  if (welcome)
    welcome.style.display = "none";

  const div =
    document.createElement("div");

  div.className =
    "message " +
    (type === "user"
      ? "user-msg"
      : "ai-msg");

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;
}


// -------------------------
// SEND MESSAGE
// -------------------------

async function sendMessage() {

  const text =
    message.value.trim();

  if (!text) return;

  if (!token) {

    loginScreen.style.display =
      "flex";

    return;
  }

  addMessage(text, "user");

  message.value = "";

  send.disabled = true;

  const typing =
    document.createElement("div");

  typing.className = "typing";

  typing.textContent =
    "EMORA AI is thinking...";

  chat.appendChild(typing);

  chat.scrollTop =
    chat.scrollHeight;


  try {

    const res =
      await fetch(
        API_URL + "/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            Authorization:
              "Bearer " + token
          },

          body: JSON.stringify({
            message: text
          })
        }
      );

    const data =
      await res.json();

    typing.remove();

    if (!res.ok || !data.success) {

      addMessage(
        data.error ||
        "AI response পাওয়া যায়নি।",
        "ai"
      );

    } else {

      addMessage(
        data.reply,
        "ai"
      );

    }

  } catch (error) {

    typing.remove();

    addMessage(
      "Server-এর সাথে যোগাযোগ করা যাচ্ছে না।",
      "ai"
    );

  }

  send.disabled = false;

  message.focus();
}


// -------------------------
// BUTTON
// -------------------------

send.onclick =
  sendMessage;


// -------------------------
// ENTER
// -------------------------

message.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "Enter" &&
      !e.shiftKey
    ) {

      e.preventDefault();

      sendMessage();
    }

  }
);


// -------------------------
// START
// -------------------------

loadUser();

</script>

</body>
</html>
